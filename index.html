P('fisc','Al revisar la declaración de renta del año gravable 2023 de una sociedad, usted encuentra costos sin soporte que reducen el impuesto. Antes de proferir la liquidación oficial de revisión, la DIAN debe obligatoriamente:',
['Notificar un requerimiento especial que contenga los puntos a modificar y su explicación.','Notificar un emplazamiento para corregir y esperar la respuesta del contribuyente.','Practicar una inspección contable y trasladar el acta al contribuyente.'],0,
'El requerimiento especial es el único acto previo obligatorio a la liquidación de revisión. El emplazamiento para corregir y la inspección son facultativos.','Arts. 702-703 ET');
P('fisc','Una persona natural debía declarar renta el 15 de agosto de 2023 y presentó oportunamente. ¿Hasta cuándo, como regla general, puede la DIAN notificarle el requerimiento especial?',
['Hasta el 15 de agosto de 2025, es decir, dos años después del vencimiento.','Hasta el 15 de agosto de 2026, dentro de los tres años siguientes al vencimiento del plazo para declarar.','Hasta el 15 de agosto de 2028, porque el término general es de cinco años.'],1,
'El requerimiento especial debe notificarse dentro de los 3 años siguientes al vencimiento del plazo para declarar (o a la presentación, si fue extemporánea).','Art. 705 ET');
P('fisc','Un contribuyente presentó extemporáneamente su declaración. Para contar el término de notificación del requerimiento especial, la regla es tomar como punto de partida:',
['La fecha de vencimiento del plazo para declarar, sin excepción.','La fecha de notificación del primer requerimiento ordinario.','La fecha de presentación de la declaración extemporánea.'],2,
'Cuando la declaración se presenta en forma extemporánea, los 3 años se cuentan desde la fecha de su presentación.','Art. 705 ET');
P('fisc','El contribuyente le pregunta de cuánto tiempo dispone para responder el requerimiento especial que se le notificó. La respuesta correcta es:',
['Tres meses contados a partir de su notificación.','Un mes contado a partir de su notificación.','Quince días hábiles contados desde su notificación.'],0,
'El término para responder el requerimiento especial es de 3 meses contados a partir de su notificación.','Art. 707 ET');
P('fisc','Vencido el término para responder el requerimiento especial, la DIAN cuenta con el siguiente plazo para notificar la liquidación oficial de revisión:',
['Un año, contado desde la notificación del requerimiento.','Seis meses, contados desde el vencimiento del término para dar respuesta al requerimiento o a su ampliación.','Tres meses, contados desde la fecha en que se recibió la respuesta.'],1,
'La liquidación de revisión debe notificarse dentro de los 6 meses siguientes al vencimiento del término para responder el requerimiento o su ampliación.','Art. 710 ET');
P('fisc','Durante una investigación, la DIAN decreta de oficio una inspección tributaria. Frente al término para notificar el requerimiento especial, esto produce:',
['La suspensión del término por tres meses contados a partir de la notificación del auto que la decreta.','La interrupción del término, que vuelve a contarse completo desde cero.','Ningún efecto, porque la inspección es un medio de prueba independiente.'],0,
'La inspección tributaria de oficio suspende el término por 3 meses; la decretada a solicitud del contribuyente lo suspende mientras dure.','Art. 706 ET');
P('fisc','Usted notifica un emplazamiento para corregir a un contribuyente. Este no responde. ¿Cuál es la consecuencia?',
['Se le impone automáticamente la sanción por no enviar información.','La no respuesta no ocasiona sanción; la DIAN puede continuar el proceso de determinación.','La declaración se tiene por no presentada.'],1,
'El emplazamiento para corregir es facultativo; su no respuesta no genera sanción. Si corrige, liquida sanción por corrección del 20 %.','Art. 685 ET');
P('fisc','Un contribuyente acepta en la respuesta al requerimiento especial los hechos planteados por la DIAN y corrige su declaración. La sanción por inexactitud:',
['Se reduce a la mitad de la propuesta por la Administración.','Se mantiene igual, porque la aceptación es posterior al inicio del proceso.','Se reduce a la cuarta parte de la planteada por la Administración.'],2,
'Con ocasión de la respuesta al requerimiento (o a su ampliación), la sanción por inexactitud se reduce a la cuarta parte.','Art. 709 ET');
P('fisc','Notificada la liquidación oficial de revisión, el contribuyente decide aceptar los hechos dentro del término para interponer el recurso. La sanción por inexactitud se reduce a:',
['La mitad de la sanción impuesta.','La cuarta parte de la sanción impuesta.','Cero, si paga dentro del mes siguiente.'],0,
'La corrección provocada por la liquidación de revisión reduce la sanción por inexactitud a la mitad.','Art. 713 ET');
P('fisc','Una persona jurídica obligada a declarar renta no lo hizo. Como gestor, el primer acto que debe notificarse dentro del proceso de determinación es:',
['La liquidación de aforo, de manera directa.','El emplazamiento para declarar, otorgando un mes para cumplir.','El requerimiento especial, por tres meses.'],1,
'A los omisos se les notifica primero el emplazamiento para declarar (1 mes). Si persisten, se impone sanción por no declarar y luego procede la liquidación de aforo.','Arts. 715-717 ET');
P('fisc','Agotado el procedimiento contra un omiso, la liquidación de aforo puede proferirse dentro de:',
['Los tres años siguientes al vencimiento del plazo para declarar.','Los dos años siguientes a la notificación de la sanción por no declarar.','Los cinco años siguientes al vencimiento del plazo para declarar.'],2,
'La liquidación de aforo se profiere dentro de los 5 años siguientes al vencimiento del plazo para declarar.','Art. 717 ET');
P('fisc','Como regla general, una declaración tributaria presentada oportunamente queda en firme:',
['Si dentro de los tres años siguientes al vencimiento del plazo para declarar no se ha notificado requerimiento especial.','Si dentro de los cinco años siguientes a su presentación no se ha iniciado cobro coactivo.','Al año siguiente a su presentación, salvo que el contribuyente la corrija.'],0,
'La regla general de firmeza es de 3 años desde el vencimiento del plazo para declarar.','Art. 714 ET');
P('fisc','Una sociedad sujeta al régimen de precios de transferencia presentó su declaración de renta. Su término de firmeza es de:',
['Tres años, como la regla general.','Cinco años.','Diez años, por tratarse de operaciones internacionales.'],1,
'Las declaraciones sujetas a precios de transferencia y las que determinan o compensan pérdidas fiscales tienen firmeza de 5 años.','Art. 714 ET');
P('fisc','Un contribuyente quiere corregir su declaración para aumentar el impuesto. Puede hacerlo:',
['En cualquier momento, incluso después de la liquidación de revisión.','Solamente dentro del mes siguiente al vencimiento del plazo para declarar.','Dentro de los tres años siguientes al vencimiento del plazo para declarar y antes de que se le notifique requerimiento especial o pliego de cargos.'],2,
'La corrección voluntaria que aumenta el impuesto procede dentro de los 3 años siguientes y antes de notificado el requerimiento especial o pliego de cargos, liquidando sanción por corrección.','Art. 588 ET');
P('fisc','Al revisar una declaración de IVA observa que no tiene la firma del revisor fiscal, siendo el contribuyente obligado a tenerlo. Esta declaración:',
['Es válida, pero genera sanción por corrección.','Se tiene por no presentada.','Debe ser corregida de oficio por la DIAN mediante liquidación de corrección aritmética.'],1,
'La declaración se tiene por no presentada cuando se omite la firma del contador o revisor fiscal existiendo la obligación legal.','Art. 580 ET');
P('fisc','Durante la investigación no se logra probar un hecho que el contribuyente no estaba obligado a demostrar. Según el régimen probatorio tributario:',
['El vacío probatorio se resuelve a favor de la Administración.','Debe suspenderse la investigación hasta obtener la prueba.','El vacío probatorio se resuelve a favor del contribuyente.'],2,
'Los vacíos probatorios se resuelven a favor del contribuyente cuando no se encuentre obligado a probar determinados hechos (in dubio contra fiscum).','Art. 745 ET');
P('fisc','Los hechos consignados en las declaraciones tributarias:',
['Se consideran ciertos, siempre que no hayan sido desvirtuados por la Administración.','Carecen de valor probatorio hasta que la DIAN los verifique.','Solo tienen valor si están acompañados de certificación del revisor fiscal.'],0,
'Presunción de veracidad: los hechos consignados en las declaraciones se consideran ciertos mientras no sean desvirtuados.','Art. 746 ET');
P('fisc','Usted necesita información de un tercero proveedor para cruzarla con la declaración de un contribuyente investigado. El instrumento adecuado es:',
['Un requerimiento especial al proveedor.','Un requerimiento ordinario de información con un plazo de respuesta no inferior a 15 días calendario.','Un emplazamiento para declarar al proveedor.'],1,
'El requerimiento ordinario permite solicitar información a contribuyentes y terceros; el plazo de respuesta no puede ser inferior a 15 días calendario.','Arts. 684 y 686 ET');
P('fisc','¿Cuál de las siguientes NO es una facultad de fiscalización de la DIAN?',
['Ordenar la exhibición de libros de contabilidad y sus soportes.','Citar o requerir al contribuyente o a terceros para que rindan informes.','Imponer penas privativas de la libertad por evasión.'],2,
'Las penas privativas de la libertad son competencia de los jueces penales. Las otras son facultades del art. 684 ET.','Art. 684 ET');
P('fisc','Al practicar una inspección contable en la sede del contribuyente, usted debe:',
['Levantar un acta firmada por los funcionarios y el contribuyente, y entregarle copia.','Llevarse los libros originales a la oficina de la DIAN sin dejar constancia.','Limitarse a tomar fotografías sin levantar acta para agilizar.'],0,
'De la inspección contable se levanta acta que firman los funcionarios y las partes, y se entrega copia; el acta hace parte de la actuación.','Art. 782 ET');
P('fisc','El contribuyente interpone recurso de reconsideración contra una liquidación oficial de revisión. El plazo para interponerlo es:',
['Diez días hábiles siguientes a la notificación.','Dos meses siguientes a la notificación del acto.','Tres meses siguientes a la notificación del acto.'],1,
'El recurso de reconsideración se interpone dentro de los 2 meses siguientes a la notificación.','Art. 720 ET');
P('fisc','La DIAN no resolvió dentro del año siguiente un recurso de reconsideración interpuesto en debida forma. La consecuencia es:',
['El recurso se entiende fallado a favor del recurrente (silencio administrativo positivo).','El recurso se entiende negado y el contribuyente puede acudir a la jurisdicción.','El término se prorroga automáticamente por seis meses.'],0,
'Si la DIAN no resuelve en el término de 1 año, opera el silencio administrativo positivo, que debe ser declarado de oficio o a petición.','Arts. 732 y 734 ET');
P('fisc','Una sociedad celebra una serie de contratos sin propósito comercial real, cuyo único efecto es trasladar utilidades para reducir el impuesto. Esta conducta corresponde a:',
['Planeación tributaria legítima que la DIAN no puede cuestionar.','Error de apreciación que no genera consecuencias.','Abuso en materia tributaria, que permite a la DIAN recaracterizar las operaciones.'],2,
'El abuso tributario es el uso de operaciones artificiales, sin propósito económico o comercial, para obtener un provecho tributario. La DIAN puede desconocerlas y recaracterizarlas.','Art. 869 ET');
P('fisc','Un contribuyente con saldo a favor en renta solicita devolución. La solicitud debe presentarse:',
['Dentro del mes siguiente a la presentación de la declaración.','Dentro de los cinco años siguientes al vencimiento del plazo para declarar.','Dentro de los dos años siguientes al vencimiento del plazo para declarar.'],2,
'La devolución de saldos a favor debe solicitarse a más tardar 2 años después del vencimiento del plazo para declarar.','Art. 854 ET');
P('fisc','La DIAN debe devolver un saldo a favor, cuando no hay garantía, dentro de los:',
['Cincuenta días hábiles siguientes a la fecha de la solicitud presentada oportunamente y en debida forma.','Diez días hábiles siguientes a la solicitud.','Seis meses siguientes a la solicitud.'],0,
'El término general es de 50 días hábiles; con garantía, 20 días hábiles.','Arts. 855 y 860 ET');
P('fisc','La acción de cobro de las obligaciones tributarias prescribe, como regla general, en:',
['Tres años.','Cinco años.','Diez años.'],1,
'La acción de cobro prescribe en 5 años contados según el art. 817 ET.','Art. 817 ET');
P('fisc','Al notificar un acto de determinación, el contribuyente había informado expresamente una dirección procesal en la respuesta al requerimiento. La DIAN debe:',
['Notificar a la dirección del RUT, por ser la única válida.','Notificar a la dirección procesal informada para ese proceso.','Notificar por aviso en la página web, sin enviar el acto.'],1,
'Si dentro del proceso se informa una dirección procesal, la DIAN debe notificar a esa dirección.','Art. 564 ET');
P('fisc','En un proceso de determinación encuentra que el contribuyente cometió un error aritmético al sumar sus ingresos que generó un menor impuesto. El acto procedente es:',
['La liquidación oficial de corrección aritmética.','La liquidación de aforo.','La resolución que declara la declaración como no presentada.'],0,
'Los errores aritméticos (sumas, operaciones, tarifas mal aplicadas) se corrigen mediante liquidación de corrección aritmética.','Arts. 697-698 ET');
P('fisc','La liquidación oficial de revisión solo puede referirse a los hechos contemplados en el requerimiento especial o en su ampliación. Este es el principio de:',
['Favorabilidad.','Correspondencia entre la declaración, el requerimiento y la liquidación.','Gradualidad de la sanción.'],1,
'Debe existir correspondencia: la liquidación de revisión se contrae a la declaración y a los hechos del requerimiento o su ampliación.','Art. 711 ET');
P('fisc','Un contribuyente investigado le solicita copia del expediente y la oportunidad de presentar pruebas antes de la decisión. Usted debe:',
['Negarlo, porque el expediente tributario es reservado incluso para él.','Permitirlo, porque el debido proceso garantiza el derecho de defensa y contradicción.','Exigirle que primero pague el mayor impuesto propuesto.'],1,
'El contribuyente tiene derecho a conocer el expediente y a controvertir pruebas (art. 29 C.P.). La reserva opera frente a terceros, no frente al propio interesado.','Art. 29 C.P.; art. 583 ET');
P('fisc','Una precrítica de insumos (función 1 del empleo) muestra que un contribuyente reportó ingresos muy inferiores a lo que informan terceros en exógena. Lo procedente es:',
['Archivar el insumo, porque la exógena no es prueba.','Clasificar el insumo y establecer la pertinencia de iniciar una investigación, documentando el análisis.','Proferir de inmediato una liquidación oficial de revisión.'],1,
'La precrítica busca clasificar los insumos y determinar si es pertinente abrir investigación, según procedimientos institucionales. La liquidación requiere todo el proceso previo.','Función esencial 1 – Ficha AT-FL-3007');
P('fisc','Recibe una denuncia anónima, detallada y verificable, sobre ventas sin factura en un establecimiento. Según la función 2 del empleo, usted debe:',
['Descartarla por ser anónima.','Hacer el análisis preliminar y establecer la pertinencia de iniciar una acción de fiscalización.','Trasladarla directamente a la Fiscalía.'],1,
'El análisis preliminar de denuncias permite establecer si procede una acción de fiscalización, de acuerdo con la normativa y los lineamientos.','Función esencial 2 – Ficha AT-FL-3007');

// ===================== RÉGIMEN SANCIONATORIO =====================
P('sanc','Una sanción tributaria liquidada da un valor inferior al mínimo legal. El valor mínimo de cualquier sanción, incluidas las que liquide el contribuyente, es:',
['5 UVT.','10 UVT.','20 UVT.'],1,'La sanción mínima es equivalente a 10 UVT.','Art. 639 ET');
P('sanc','Un contribuyente presenta su declaración de renta dos meses y diez días después del vencimiento, sin que haya mediado emplazamiento. La sanción por extemporaneidad es:',
['5 % del impuesto a cargo por cada mes o fracción de mes, es decir, 15 %.','10 % por cada mes o fracción, es decir, 30 %.','5 % por cada mes completo, es decir, 10 %.'],0,
'Antes del emplazamiento: 5 % por mes o fracción (3 fracciones = 15 %), sin exceder el 100 % del impuesto.','Art. 641 ET');
P('sanc','Si el contribuyente declara después de notificado el emplazamiento para declarar, la sanción por extemporaneidad será:',
['5 % por mes o fracción, sin exceder el 100 %.','10 % por mes o fracción, sin exceder el 200 % del impuesto.','20 % del valor de los ingresos brutos.'],1,
'Después del emplazamiento: 10 % por mes o fracción, máximo 200 % del impuesto o retención.','Art. 642 ET');
P('sanc','La sanción por no declarar renta, cuando la DIAN tiene información sobre ingresos y consignaciones, equivale al:',
['20 % del valor de las consignaciones bancarias o de los ingresos brutos, el que fuere superior.','100 % del impuesto que se hubiera liquidado.','5 % del patrimonio líquido.'],0,
'La sanción por no declarar renta es del 20 % del mayor valor entre consignaciones e ingresos brutos.','Art. 643 ET');
P('sanc','Un contribuyente corrige voluntariamente su declaración, antes de cualquier emplazamiento, aumentando el saldo a pagar. La sanción por corrección es:',
['20 % del mayor valor a pagar.','10 % del mayor valor a pagar.','No hay sanción si corrige voluntariamente.'],1,
'La sanción por corrección es del 10 % del mayor valor; del 20 % si se corrige después de notificado el emplazamiento para corregir o el auto de inspección.','Art. 644 ET');
P('sanc','¿Cuál de las siguientes situaciones NO constituye inexactitud sancionable?',
['Incluir costos de proveedores inexistentes.','Omitir ingresos gravados.','Una diferencia de criterio sobre la interpretación del derecho aplicable, cuando los hechos declarados son completos y verdaderos.'],2,
'La diferencia de criterio no constituye inexactitud siempre que los hechos y cifras sean completos y verdaderos.','Art. 647 ET');
P('sanc','Como regla general, la sanción por inexactitud equivale al:',
['10 % de la diferencia.','50 % de la diferencia.','100 % de la diferencia entre el saldo a pagar determinado por la DIAN y el declarado.'],2,
'La regla general es el 100 % de la diferencia; hay tarifas mayores en casos agravados (costos inexistentes, proveedores ficticios, etc.).','Art. 648 ET');
P('sanc','Para imponer una sanción en resolución independiente (no dentro de una liquidación oficial), la DIAN debe:',
['Notificar previamente un pliego de cargos y dar oportunidad de respuesta.','Imponerla de plano para garantizar celeridad.','Esperar a que el contribuyente corrija voluntariamente.'],0,
'Las sanciones impuestas en resolución independiente exigen pliego de cargos previo, en garantía del debido proceso.','Arts. 637-638 ET');
P('sanc','En una visita de control a un establecimiento comercial se comprueba que no expide factura. La sanción típica es:',
['Multa del 100 % de las ventas del año.','Clausura del establecimiento, con imposición del sello "CERRADO POR EVASIÓN".','Cancelación del RUT.'],1,
'La clausura del establecimiento (con el sello "cerrado por evasión") procede, entre otras causales, por no expedir factura.','Art. 657 ET');
P('sanc','El principio sancionatorio según el cual la sanción debe corresponder a la gravedad de la falta y al daño causado se denomina:',
['Proporcionalidad.','Favorabilidad.','Legalidad.'],0,
'La proporcionalidad exige que la sanción sea adecuada a la gravedad de la conducta y al daño; la gradualidad permite reducirla según la conducta del infractor.','Art. 640 ET; Ley 1819 de 2016');
P('sanc','Durante el proceso sancionatorio entra en vigencia una ley que establece una sanción menor para la misma conducta. En virtud del principio de favorabilidad:',
['Se aplica la ley vigente cuando ocurrió la conducta, sin excepción.','Se aplica la norma más favorable al infractor, aunque sea posterior.','Se aplica el promedio de ambas sanciones.'],1,
'El principio de favorabilidad permite aplicar la ley permisiva o favorable aun cuando sea posterior a la conducta.','Art. 640 ET; art. 29 C.P.');
P('sanc','Un contribuyente soporta sus costos con facturas de una sociedad declarada por la DIAN como proveedor ficticio. Esos costos:',
['Son aceptados si el pago se hizo por medios bancarios.','No son reconocidos fiscalmente.','Son aceptados en un 50 %.'],1,
'No son deducibles los costos y deducciones soportados en operaciones con proveedores ficticios, y hay sanción agravada.','Art. 671 ET');

// ===================== SISTEMA TRIBUTARIO =====================
P('sist','¿Cuáles son los elementos esenciales del tributo que debe fijar directamente la ley, ordenanza o acuerdo?',
['Sujeto activo, sujeto pasivo, hecho generador, base gravable y tarifa.','Plazo, formulario, sanción y lugar de pago.','Hecho generador, sanción y procedimiento de cobro.'],0,
'El art. 338 de la Constitución exige que la norma fije sujetos activos y pasivos, hechos y bases gravables y tarifas.','Art. 338 C.P.');
P('sist','¿Cuál de estos tributos NO es administrado por la DIAN?',
['Impuesto sobre las ventas (IVA).','Gravamen a los movimientos financieros (GMF).','Impuesto de industria y comercio (ICA).'],2,
'El ICA es un impuesto municipal administrado por los municipios y distritos.','Normativa tributaria');
P('sist','Según el Estatuto Tributario, el IVA se causa sobre:',
['La venta de bienes, la prestación de servicios, la importación de bienes y la circulación, venta u operación de juegos de suerte y azar.','Únicamente la venta de bienes muebles.','La renta líquida de las personas jurídicas.'],0,
'Son hechos generadores del IVA: ventas, servicios, importaciones y juegos de suerte y azar (salvo loterías y juegos de suerte y azar operados exclusivamente por internet en ciertos casos).','Art. 420 ET');
P('sist','La tarifa general del IVA vigente es:',['16 %.','19 %.','21 %.'],1,'La tarifa general del IVA es del 19 %.','Art. 468 ET');
P('sist','La diferencia práctica entre bienes exentos y excluidos de IVA es que:',
['Los exentos están gravados a tarifa cero y otorgan derecho a impuestos descontables y devolución; los excluidos no causan IVA.','Los excluidos dan derecho a devolución y los exentos no.','No existe diferencia; son sinónimos.'],0,
'Los productores de bienes exentos son responsables, pueden descontar el IVA pagado y pedir devolución; los excluidos no causan el impuesto.','Arts. 424 y 477 ET');
P('sist','La retención en la fuente tiene por objeto:',
['Sancionar a los contribuyentes morosos.','Conseguir en forma gradual que el impuesto se recaude en lo posible dentro del mismo ejercicio gravable en que se cause.','Reemplazar la obligación de declarar.'],1,
'La retención en la fuente es un mecanismo de recaudo anticipado.','Art. 367 ET');
P('sist','Un ciudadano extranjero permaneció en Colombia 200 días continuos dentro de un periodo de 365 días. Para efectos tributarios es:',
['Residente fiscal, porque superó 183 días calendario.','No residente, porque no tiene nacionalidad colombiana.','Residente, solo si tiene cuenta bancaria en Colombia.'],0,
'Es residente quien permanece más de 183 días calendario, continuos o discontinuos, en un periodo de 365 días.','Art. 10 ET');
P('sist','El Registro Único Tributario (RUT) es:',
['El mecanismo único para identificar, ubicar y clasificar a los sujetos de obligaciones administradas y controladas por la DIAN.','Un registro voluntario para quienes desean facturar.','El registro de deudores morosos del Estado.'],0,
'Así lo define el art. 555-2 ET.','Art. 555-2 ET');
P('sist','La obligación de presentar declaraciones, inscribirse en el RUT y expedir factura corresponde a:',
['Obligaciones sustanciales.','Obligaciones formales.','Obligaciones aduaneras.'],1,
'La obligación sustancial es pagar el tributo; los deberes de declarar, informar, facturar o inscribirse son obligaciones formales.','Art. 1 ET y ss.');
P('sist','El sistema tributario colombiano, según la Constitución, se funda en los principios de:',
['Legalidad, solidaridad y universalidad.','Equidad, eficiencia y progresividad.','Celeridad, eficacia y economía.'],1,
'Art. 363 C.P.: equidad, eficiencia y progresividad; además, las leyes tributarias no se aplican con retroactividad.','Art. 363 C.P.');
P('sist','Los tributos aduaneros que se liquidan en una importación ordinaria comprenden principalmente:',
['El gravamen arancelario y el IVA a las importaciones.','El impuesto de renta y el ICA.','El GMF y el impuesto de timbre.'],0,
'Los tributos aduaneros comprenden los derechos de aduana (arancel) y el IVA a la importación, entre otros.','Decreto 1165 de 2019');
// ===================== FISCALIZACIÓN ADUANERA =====================
P('adua','En una acción de control posterior, usted verifica una declaración de importación cuyas mercancías ya obtuvieron levante. Este tipo de control se denomina:',
['Control previo.','Control simultáneo.','Control posterior.'],2,
'El control posterior se ejerce después del levante, mediante fiscalización. El simultáneo ocurre durante el desaduanamiento (inspección).','Decreto 1165 de 2019');
P('adua','El acto mediante el cual la autoridad aduanera permite a los interesados la disposición de la mercancía, una vez cumplidos los requisitos, se denomina:',
['Aprehensión.','Levante.','Decomiso.'],1,'El levante autoriza la disposición de la mercancía.','Decreto 1165 de 2019, art. 3');
P('adua','En un operativo encuentra mercancía extranjera en un almacén sin documentos que acrediten su legal introducción. La medida cautelar que procede es:',
['La aprehensión de la mercancía, levantando el acta correspondiente.','El decomiso inmediato de plano, sin acta.','La destrucción inmediata de la mercancía.'],0,
'La aprehensión es la medida cautelar que retiene mercancías sobre las cuales se configura una causal de decomiso; luego se adelanta el proceso de decomiso con garantía de defensa.','Régimen de decomiso de mercancías');
P('adua','La decisión que, previo procedimiento, transfiere a la Nación la propiedad de la mercancía cuya legal introducción no se acreditó se denomina:',
['Abandono voluntario.','Decomiso.','Rescate.'],1,'El decomiso es la decisión de fondo que pasa la mercancía a propiedad de la Nación.','Régimen de decomiso de mercancías');
P('adua','Un importador introduce mercancías por un lugar no habilitado y nunca las presenta ante la aduana. Esta conducta se conoce como:',
['Contrabando abierto.','Contrabando técnico.','Subvaloración simple.'],0,
'Contrabando abierto: ingreso o salida sin presentar la mercancía a la aduana o por lugares no habilitados. El técnico implica presentar la mercancía pero con irregularidades.','Art. 319 C.P.; Ley 1762 de 2015');
P('adua','Un importador presenta la mercancía ante la aduana pero declara un valor muy inferior al real para pagar menos tributos. Esta práctica corresponde a:',
['Contrabando abierto.','Contrabando técnico (fraude aduanero por subfacturación).','Una operación de tránsito aduanero.'],1,
'La subfacturación, la falsa clasificación o el falso origen en una mercancía presentada son modalidades de contrabando técnico/fraude aduanero.','Art. 321 C.P.; Ley 1762 de 2015');
P('adua','Según el Código Penal (Ley 1762 de 2015), el contrabando es delito cuando el valor de la mercancía:',
['Supera 50 salarios mínimos legales mensuales vigentes.','Supera 10 SMMLV.','Supera cualquier valor, pues todo contrabando es delito.'],0,
'Por encima de 50 SMMLV es delito (art. 319 C.P.); por debajo es una infracción administrativa aduanera que da lugar al decomiso.','Art. 319 C.P.');
P('adua','Para determinar la base gravable de una importación, el primer método de valoración que debe aplicarse es:',
['El método deductivo.','El método del valor de transacción de las mercancías importadas.','El método del último recurso.'],1,
'Según el Acuerdo de Valoración de la OMC y la Decisión 571 de la CAN, el primer método es el valor de transacción; los demás se aplican en orden sucesivo.','Acuerdo de Valoración OMC; Decisión CAN 571');
P('adua','Para clasificar arancelariamente una mercancía, la primera regla que se aplica es:',
['Clasificar por el material que predomine en peso.','La Regla General Interpretativa 1: la clasificación está determinada por los textos de las partidas y de las notas de sección o capítulo.','Clasificar en la partida con el arancel más bajo.'],1,
'La RGI 1 del Sistema Armonizado establece que los títulos son indicativos y la clasificación se determina legalmente por los textos de partidas y notas.','Arancel de Aduanas – Sistema Armonizado');
P('adua','El régimen que permite transportar mercancías bajo control aduanero de una aduana a otra dentro del territorio, con suspensión de tributos, es:',
['La importación temporal.','El tránsito aduanero.','La exportación temporal.'],1,'El tránsito aduanero permite el transporte bajo control aduanero con suspensión de tributos.','Decreto 1165 de 2019');
P('adua','Como regla general, la declaración aduanera queda en firme:',
['Al momento del levante.','Transcurridos tres años contados a partir de su aceptación, salvo que se haya notificado requerimiento especial aduanero.','Transcurridos diez años desde la importación.'],1,
'La firmeza de la declaración aduanera es de 3 años desde su aceptación, salvo notificación de requerimiento especial aduanero.','Decreto 1165 de 2019');
P('adua','En un proceso de fiscalización aduanera para formular una liquidación oficial o proponer una sanción, el acto previo mediante el cual la DIAN propone los cargos es:',
['El requerimiento especial aduanero.','El emplazamiento para declarar.','La resolución de aprehensión.'],0,
'El requerimiento especial aduanero es el acto de trámite previo para proponer liquidaciones oficiales o sanciones aduaneras.','Régimen aduanero');
P('adua','Un importador solicita la destrucción de mercancía averiada que llegó defectuosa. Usted es designado para participar en la diligencia (función 9 del empleo). Lo correcto es:',
['Verificar la identidad y cantidad de la mercancía, presenciar la destrucción en las condiciones autorizadas y suscribir el acta correspondiente.','Autorizar al importador a destruirla sin presencia de la DIAN para ahorrar tiempo.','Llevarse muestras de la mercancía para uso personal.'],0,
'La participación en destrucciones exige verificar que la mercancía corresponda a la autorizada, presenciar el procedimiento y documentarlo en acta.','Función esencial 9 – Ficha AT-FL-3007');
P('adua','La Ley 1609 de 2013 es:',
['La ley marco de aduanas, que contiene las normas generales a las que debe sujetarse el Gobierno para modificar los aranceles y el régimen de aduanas.','La ley anticontrabando.','El régimen sancionatorio cambiario.'],0,
'La Ley 1609 de 2013 es la ley marco de aduanas. La ley anticontrabando es la 1762 de 2015.','Ley 1609 de 2013');
P('adua','La Corte Constitucional, mediante la Sentencia C-072 de 2025, decidió respecto del Decreto Ley 920 de 2023 (régimen sancionatorio aduanero):',
['Declararlo exequible sin condiciones.','Declararlo inexequible, difiriendo sus efectos hasta el 20 de junio de 2026 para que el Congreso expidiera una ley.','Declararlo inexequible con efectos inmediatos.'],1,
'La Corte declaró inexequible el art. 68 de la Ley 2277 de 2022 y, por consecuencia, el DL 920 de 2023, con efectos diferidos al 20 de junio de 2026.','Sentencia C-072 de 2025');
P('adua','La principal norma vigente que reglamenta el régimen de aduanas en Colombia (regímenes, declarantes, control) es:',
['El Decreto 1165 de 2019.','El Decreto 2685 de 1999, sin modificaciones.','La Ley 9 de 1991.'],0,
'El Decreto 1165 de 2019 reemplazó en su mayoría al Decreto 2685 de 1999. La Ley 9 de 1991 es la ley marco cambiaria.','Decreto 1165 de 2019');
P('adua','Un comerciante tiene en su bodega mercancía de contrabando, sabiendo su origen, con valor superior a 50 SMMLV, aunque él no la importó. Penalmente esta conducta puede configurar:',
['Favorecimiento y facilitación del contrabando.','Ninguna conducta, porque no la introdujo al país.','Omisión del agente retenedor.'],0,
'Quien posea, tenga, transporte, almacene o enajene mercancía introducida de contrabando incurre en favorecimiento (art. 320 C.P.).','Art. 320 C.P.');
P('adua','El Operador Económico Autorizado (OEA) es:',
['Un funcionario de la DIAN encargado de inspecciones.','Un usuario de la cadena de suministro que, al cumplir requisitos de seguridad y confiabilidad, obtiene beneficios y facilidades en los controles.','Un agente de aduanas obligatorio para toda importación.'],1,
'El OEA es una figura de la OMA para operadores confiables con beneficios en el control aduanero.','Decreto 3568 de 2011');
P('adua','Durante una inspección física, el importador le ofrece "agilizar" el levante con un pago en efectivo. Usted debe:',
['Aceptar si el valor es bajo y no altera el resultado.','Rechazar el ofrecimiento, dejar constancia e informar por los canales institucionales.','Ignorar el comentario y continuar sin dejar registro.'],1,
'El ofrecimiento constituye un hecho que debe rechazarse y reportarse; aceptarlo constituiría cohecho.','Código de Integridad; art. 405-407 C.P.');
P('adua','Al planificar la logística de una acción de control (función 7) en zona de frontera con alto riesgo de contrabando, lo más adecuado es:',
['Definir objetivos, recursos, personal, apoyo de la Policía Fiscal y Aduanera (POLFA) y cronograma según los lineamientos institucionales.','Ir solo y sin informar a nadie para no alertar a los infractores.','Esperar a que el contribuyente acepte la visita para programarla.'],0,
'Planificar la logística implica prever recursos, apoyo de la POLFA, seguridad y resultados esperados conforme a lineamientos.','Función esencial 7 – Ficha AT-FL-3007');

// ===================== RÉGIMEN CAMBIARIO =====================
P('camb','La autoridad cambiaria que expide la regulación de las operaciones de cambio en Colombia es:',
['La DIAN.','La Junta Directiva del Banco de la República.','La Superintendencia Financiera.'],1,
'La Junta Directiva del Banco de la República es la autoridad cambiaria (Ley 9 de 1991 y Ley 31 de 1992). La DIAN es entidad de control y vigilancia.','Ley 9 de 1991; Ley 31 de 1992');
P('camb','La DIAN ejerce control y vigilancia cambiaria, entre otras, sobre:',
['Las operaciones de importación y exportación de bienes y servicios, sus gastos asociados, su financiación y la sub o sobrefacturación.','La inversión extranjera en sociedades vigiladas por Supersociedades exclusivamente.','La política monetaria y la tasa de cambio.'],0,
'Esa es la competencia cambiaria de la DIAN; la Supersociedades vigila inversiones internacionales y endeudamiento externo de sus vigiladas.','Decreto 1074 de 1999; DL 2245 de 2011');
P('camb','¿Cuál de las siguientes operaciones es de canalización OBLIGATORIA a través del mercado cambiario?',
['El pago de una importación de bienes.','El pago de servicios de consultoría prestados por un no residente.','Una donación de un familiar en el exterior.'],0,
'Son de canalización obligatoria: importaciones y exportaciones de bienes, endeudamiento externo, inversiones internacionales, avales y garantías, y derivados. Servicios y transferencias son de mercado libre.','Ley 9 de 1991; Res. Externa 1 de 2018 BR');
P('camb','El pago al exterior por servicios técnicos prestados por una empresa extranjera es una operación:',
['De canalización obligatoria.','De mercado libre, que puede canalizarse voluntariamente.','Prohibida por el régimen cambiario.'],1,
'Los servicios no son operaciones obligatoriamente canalizables; pueden canalizarse en forma voluntaria.','Res. Externa 1 de 2018 BR');
P('camb','La canalización de operaciones de cambio obligatorias se hace a través de:',
['Cualquier casa de cambio o persona natural.','Los intermediarios del mercado cambiario (IMC) o las cuentas de compensación registradas ante el Banco de la República.','La DIAN, mediante formulario.'],1,
'Las divisas de operaciones obligatorias se canalizan por IMC o por cuentas de compensación.','Res. Externa 1 de 2018 BR');
P('camb','El régimen sancionatorio y el procedimiento administrativo cambiario a cargo de la DIAN se encuentran en:',
['El Decreto Ley 2245 de 2011.','El CPACA, capítulo sancionatorio, exclusivamente.','La Ley 1762 de 2015.'],0,
'El DL 2245 de 2011 es la norma especial; el CPACA aplica solo en lo no regulado.','DL 2245 de 2011');
P('camb','Según la doctrina DIAN sobre el art. 5 del Decreto Ley 2245 de 2011, el acto de formulación de cargos por infracción cambiaria debe notificarse dentro de:',
['Los tres años siguientes a los hechos, conforme al art. 52 del CPACA.','Los cinco años siguientes a la ocurrencia de los hechos constitutivos de infracción.','Los diez años siguientes a los hechos.'],1,
'La DIAN ha señalado que el término es de 5 años, y que esta norma especial prevalece sobre el art. 52 del CPACA.','Art. 5 DL 2245 de 2011; Oficio DIAN 8644 de 2025');
P('camb','En materia cambiaria, el incumplimiento de plazos o términos legales señalados por el régimen cambiario:',
['Se considera infracción continuada.','No se considera infracción continuada.','No es sancionable.'],1,
'El art. 5 del DL 2245 de 2011 precisa que el incumplimiento de plazos no se considera infracción continuada.','Art. 5 DL 2245 de 2011');
P('camb','Un usuario cometió un error en la información de una operación de cambio que el régimen cambiario permite corregir en cualquier tiempo. En este caso:',
['Hay infracción cambiaria con multa del 100 %.','No hay infracción cambiaria.','Hay infracción, pero se reduce a la mitad.'],1,
'No hay infracción cuando se trate de errores cuya aclaración, modificación o actualización sea permitida en cualquier tiempo por el régimen cambiario.','DL 2245 de 2011');
P('camb','La ley marco que establece las normas generales a las que debe sujetarse el Gobierno para regular los cambios internacionales es:',
['La Ley 9 de 1991.','La Ley 1609 de 2013.','La Ley 2277 de 2022.'],0,'La Ley 9 de 1991 es la ley marco cambiaria.','Ley 9 de 1991');
P('camb','Una persona residente abre una cuenta en un banco del exterior para canalizar pagos de exportaciones. Para que sirva como mecanismo de canalización debe:',
['Registrarla como cuenta de compensación ante el Banco de la República y cumplir los deberes de información.','Informarla únicamente en su declaración de renta.','No requiere ningún trámite.'],0,
'Las cuentas en el exterior que canalizan operaciones obligatorias deben registrarse como cuentas de compensación y reportar sus movimientos.','Res. Externa 1 de 2018 BR');
P('camb','Analizando operaciones de una exportadora, detecta que los reintegros de divisas superan ampliamente el valor de las mercancías exportadas. Esta señal puede indicar:',
['Una operación normal sin riesgo.','Sobrefacturación de exportaciones, posible mecanismo de lavado de activos o de ingreso irregular de divisas, que amerita investigación.','Un error del banco que no compete a la DIAN.'],1,
'La sobrefacturación de exportaciones es una tipología de lavado basado en comercio y es competencia cambiaria de la DIAN.','DL 2245 de 2011; tipologías UIAF');
P('camb','La inversión extranjera directa en Colombia debe:',
['Registrarse ante el Banco de la República, conforme al régimen general de inversiones internacionales.','Registrarse solo ante la DIAN.','Ser autorizada previamente por el Congreso.'],0,
'El régimen de inversiones internacionales (Decreto 119 de 2017, compilado en el Decreto 1068 de 2015) exige el registro ante el Banco de la República.','Decreto 119 de 2017');

// ===================== FISCALIZACIÓN INTERNACIONAL =====================
P('intl','El principio según el cual las operaciones entre vinculados deben pactarse en las mismas condiciones que entre partes independientes se denomina:',
['Principio de territorialidad.','Principio de plena competencia (arm\'s length).','Principio de renta mundial.'],1,'Es el fundamento del régimen de precios de transferencia.','Art. 260-2 ET');
P('intl','Están obligados a presentar la declaración informativa de precios de transferencia los contribuyentes con operaciones con vinculados cuyo patrimonio bruto o ingresos brutos sean iguales o superiores a:',
['Patrimonio bruto 100.000 UVT o ingresos brutos 61.000 UVT.','Patrimonio bruto 10.000 UVT o ingresos 5.000 UVT.','Cualquier valor.'],0,
'Esos son los topes de los arts. 260-5 y 260-9 ET. Las operaciones con jurisdicciones no cooperantes quedan sujetas sin importar topes.','Arts. 260-5 y 260-9 ET');
P('intl','¿Cuál de los siguientes NO es un método de precios de transferencia del Estatuto Tributario?',
['Precio comparable no controlado.','Costo adicionado.','Método del valor en aduana deductivo.'],2,
'Los métodos del ET son: precio comparable no controlado, precio de reventa, costo adicionado, partición de utilidades y márgenes transaccionales.','Art. 260-3 ET');
P('intl','Una sociedad colombiana realiza compras a una empresa ubicada en una jurisdicción no cooperante de baja o nula imposición con la que NO tiene vinculación. Estas operaciones:',
['Están por fuera del régimen de precios de transferencia.','Se someten al régimen de precios de transferencia aunque no exista vinculación.','Están prohibidas.'],1,
'Las operaciones con jurisdicciones no cooperantes, de baja o nula imposición o regímenes preferenciales se someten al régimen.','Art. 260-7 ET');
P('intl','Una empresa extranjera tiene en Colombia una oficina permanente desde la cual vende y presta servicios. Para efectos tributarios, esto puede configurar:',
['Un establecimiento permanente, cuyas rentas atribuibles tributan en Colombia.','Una operación de tránsito aduanero.','Una inversión de portafolio.'],0,
'El establecimiento permanente es un lugar fijo de negocios por medio del cual una empresa extranjera realiza su actividad en el país.','Art. 20-1 ET');
P('intl','Una sociedad constituida en el exterior cuya sede efectiva de administración está en Colombia es considerada:',
['Sociedad extranjera sin obligaciones en Colombia.','Sociedad nacional para efectos tributarios.','Establecimiento permanente.'],1,'Por la sede efectiva de administración se considera nacional.','Art. 12-1 ET');
P('intl','El régimen de Entidades Controladas del Exterior (ECE) busca:',
['Gravar en Colombia, en cabeza del residente controlante, las rentas pasivas obtenidas por la entidad del exterior, sin esperar la distribución de dividendos.','Eximir de impuestos a las inversiones colombianas en el exterior.','Controlar el ingreso de divisas.'],0,
'El régimen ECE evita el diferimiento de rentas pasivas en sociedades del exterior controladas por residentes.','Arts. 882 y ss. ET');
P('intl','Para obtener información financiera de un contribuyente colombiano en una cuenta bancaria de otro país, la DIAN puede apoyarse en:',
['Los instrumentos de intercambio de información, como la Convención Multilateral de Asistencia Administrativa Mutua y el estándar CRS.','La solicitud directa al banco extranjero por correo electrónico personal.','Únicamente la declaración voluntaria del contribuyente.'],0,
'Colombia aprobó la Convención Multilateral (Ley 1661 de 2013) y aplica CRS y FATCA.','Ley 1661 de 2013');
P('intl','Un residente colombiano pagó impuesto de renta en otro país por rentas obtenidas allá. Para evitar la doble imposición puede, en general:',
['Solicitar el descuento tributario por impuestos pagados en el exterior.','Excluir todas sus rentas extranjeras de la declaración.','Pedir devolución del impuesto pagado en el exterior a la DIAN.'],0,
'El art. 254 ET permite el descuento por impuestos pagados en el exterior, sin perjuicio de los convenios para evitar la doble imposición.','Art. 254 ET');
P('intl','El Registro Único de Beneficiarios Finales (RUB) tiene como finalidad:',
['Identificar a las personas naturales que en último término poseen o controlan a las personas jurídicas y estructuras sin personería.','Registrar a los beneficiarios de subsidios del Estado.','Inscribir a los proveedores del Estado.'],0,
'El RUB fue creado por la Ley 2155 de 2021 y reglamentado por la Resolución DIAN 164 de 2021.','Ley 2155 de 2021');
P('intl','Para los empleos de nivel profesional ubicados en la Subdirección de Gestión de Fiscalización Internacional, la ficha AT-FL-3007 exige como requisito adicional:',
['Especialización en derecho internacional.','Certificado de inglés en nivel B2.','Dos años de experiencia en comercio exterior.'],1,
'Así lo establece la ficha en "Otros requisitos del empleo".','Ficha AT-FL-3007');

// ===================== EVASIÓN, ELUSIÓN, CONTRABANDO, LA/FT =====================
P('evas','Un contribuyente oculta ingresos llevando una doble contabilidad. Esta conducta es:',
['Elusión.','Evasión.','Planeación tributaria.'],1,'La evasión es la reducción ilegal del tributo mediante ocultamiento o falsedad.','Conceptos evasión/elusión');
P('evas','Una empresa aprovecha un vacío de la ley, sin violarla formalmente, para reducir su carga tributaria. Esta conducta se conoce como:',
['Evasión.','Elusión.','Contrabando técnico.'],1,'La elusión utiliza formas o vacíos legales para reducir el tributo; si es artificiosa puede configurar abuso (art. 869 ET).','Conceptos evasión/elusión');
P('evas','El agente retenedor que no consigna las sumas retenidas dentro de los dos meses siguientes a la fecha fijada por el Gobierno incurre en:',
['Omisión del agente retenedor o recaudador (delito).','Una simple irregularidad formal.','Contrabando.'],0,'Art. 402 del Código Penal.','Art. 402 C.P.');
P('evas','Las etapas del lavado de activos, en su orden lógico, son:',
['Integración, colocación y estratificación.','Colocación, estratificación (ocultamiento) e integración.','Estratificación, integración y colocación.'],1,
'Primero se introducen los recursos ilícitos (colocación), luego se ocultan con múltiples transacciones (estratificación) y finalmente se integran a la economía legal.','Tipologías LA/FT');
P('evas','La entidad que recibe y analiza los Reportes de Operaciones Sospechosas (ROS) en Colombia es:',
['La Fiscalía General de la Nación.','La Unidad de Información y Análisis Financiero (UIAF).','La Superintendencia de Sociedades.'],1,'La UIAF fue creada por la Ley 526 de 1999.','Ley 526 de 1999');
P('evas','En una investigación aduanera detecta operaciones que pueden estar relacionadas con lavado de activos. Respecto del Reporte de Operación Sospechosa (ROS):',
['Solo debe reportarse cuando exista certeza del delito.','No requiere certeza del delito; se reporta conforme al procedimiento interno y se guarda reserva frente al investigado.','Debe informarse previamente al investigado para garantizar su defensa.'],1,
'El ROS no es denuncia penal, no requiere certeza y es reservado; no se puede informar al reportado.','Función esencial 3; Ley 526 de 1999');
P('evas','Una importadora declara a precios muy superiores al mercado mercancía comprada a un proveedor relacionado, y paga al exterior grandes sumas. Esta es una tipología de:',
['Lavado basado en comercio (sobrefacturación de importaciones).','Contrabando abierto.','Elusión legítima.'],0,
'La sobrefacturación de importaciones permite sacar divisas del país; es una tipología común de lavado basado en comercio.','Tipologías UIAF/GAFI');
P('evas','La Ley 2195 de 2022 se relaciona principalmente con:',
['Medidas en materia de transparencia, prevención y lucha contra la corrupción.','El régimen de aduanas.','El impuesto de renta de personas naturales.'],0,
'La Ley 2195 de 2022 adoptó medidas de transparencia y lucha anticorrupción, incluidos programas de transparencia y ética empresarial.','Ley 2195 de 2022');
P('evas','La financiación del terrorismo se diferencia del lavado de activos en que:',
['Los recursos pueden tener origen lícito, pero su destino es financiar actividades terroristas.','Solo involucra dinero en efectivo.','No está tipificada como delito en Colombia.'],0,
'En la FT lo relevante es el destino de los recursos; en el lavado, su origen ilícito.','Art. 345 C.P.');
P('evas','Una persona presta su nombre para figurar como propietaria de bienes adquiridos con recursos ilícitos de un tercero. Esta conducta se conoce como:',
['Testaferrato.','Elusión.','Contrabando técnico.'],0,'El testaferrato está tipificado en el art. 326 C.P.','Art. 326 C.P.');
// ===================== CPACA Y DERECHO DE PETICIÓN =====================
P('cpaca','En un procedimiento de fiscalización tributaria surge un vacío no regulado en el Estatuto Tributario. Según el art. 2 del CPACA:',
['Se aplica el CPACA en lo no previsto por el procedimiento especial.','Se suspende la actuación hasta que el Congreso legisle.','Se aplica el Código General del Proceso de forma preferente.'],0,
'Los procedimientos especiales (como el tributario) prevalecen, y en lo no previsto se aplica el CPACA.','Art. 2 CPACA');
P('cpaca','El principio en virtud del cual las autoridades buscarán que los procedimientos logren su finalidad, removiendo obstáculos puramente formales y saneando irregularidades, es el de:',
['Eficacia.','Publicidad.','Imparcialidad.'],0,'Así define el art. 3 numeral 11 del CPACA el principio de eficacia.','Art. 3 CPACA');
P('cpaca','El principio de celeridad implica que las autoridades:',
['Impulsen oficiosamente los procedimientos, sin dilaciones injustificadas.','Actúen solo a petición de parte.','Den a conocer sus decisiones mediante publicaciones.'],0,'Celeridad: impulso oficioso y uso de tecnologías para agilizar.','Art. 3 num. 13 CPACA');
P('cpaca','Un ciudadano radica un derecho de petición de interés general ante la DIAN. Salvo norma especial, el término para resolverlo es:',
['10 días.','15 días.','30 días.'],1,'Regla general: 15 días siguientes a la recepción.','Art. 14 Ley 1437 (sust. Ley 1755 de 2015)');
P('cpaca','Un contribuyente solicita copia de documentos que reposan en la entidad y que no tienen reserva. El término para responder es:',
['10 días; si no se responde, se entiende aceptada y deben entregarse dentro de los 3 días siguientes.','30 días.','15 días; si no se responde, se entiende negada.'],0,
'Las peticiones de documentos e información se resuelven en 10 días; vencidos, se entiende aceptada la solicitud.','Art. 14 num. 1 Ley 1755 de 2015');
P('cpaca','Un ciudadano eleva una consulta sobre la interpretación de una norma. El plazo para responder es de:',['15 días.','10 días.','30 días.'],2,'Las consultas a las autoridades se resuelven en 30 días.','Art. 14 num. 2 Ley 1755 de 2015');
P('cpaca','Usted no puede responder una petición dentro del término por su complejidad. Debe:',
['Responder cuando pueda, sin avisar.','Informar al peticionario antes del vencimiento, explicando los motivos y el plazo razonable de respuesta, que no podrá exceder el doble del inicialmente previsto.','Archivar la petición por complejidad.'],1,
'Así lo ordena el parágrafo del art. 14.','Art. 14 parágrafo Ley 1755 de 2015');
P('cpaca','Recibe una petición incompleta que no permite adelantar la actuación. Lo procedente es:',
['Rechazarla de plano.','Requerir al peticionario dentro de los 10 días siguientes para que la complete en el término máximo de un mes.','Resolverla con la información disponible.'],1,
'Si el peticionario no completa en ese plazo (ni pide prórroga), se entiende que desistió (desistimiento tácito).','Art. 17 Ley 1755 de 2015');
P('cpaca','Le llega una petición sobre un asunto que es competencia de la Superintendencia de Sociedades. Usted debe:',
['Devolverla al peticionario.','Remitirla a la autoridad competente dentro de los 5 días siguientes a su recepción e informar al peticionario.','Responderla de fondo aunque no sea su competencia.'],1,'Así lo dispone el art. 21.','Art. 21 Ley 1755 de 2015');
P('cpaca','Las peticiones entre autoridades deben resolverse en un término no mayor a:',['5 días.','10 días.','15 días.'],1,'Art. 30 de la Ley 1755 de 2015.','Art. 30 Ley 1755 de 2015');
P('cpaca','Para notificar personalmente un acto administrativo cuando no hay otro medio más eficaz, se envía una citación. Si el interesado no comparece dentro de los 5 días siguientes al envío de la citación:',
['Se notifica por aviso.','Se entiende notificado automáticamente.','Se archiva la actuación.'],0,'Procede la notificación por aviso (art. 69).','Arts. 68-69 CPACA');
P('cpaca','La notificación por aviso enviada por correo se considera surtida:',
['El mismo día del envío.','Al finalizar el día siguiente al de la entrega del aviso en el lugar de destino.','Cinco días después del envío.'],1,'Así lo establece el art. 69 del CPACA.','Art. 69 CPACA');
P('cpaca','Un acto fue notificado de manera irregular, pero el interesado interpone el recurso dentro del término legal. Se entiende:',
['Que el acto nunca produjo efectos.','Que se dio por notificado por conducta concluyente, quedando saneada la irregularidad.','Que debe repetirse toda la actuación.'],1,
'Sin notificación en legal forma el acto no produce efectos, salvo que el interesado revele conocerlo o use los recursos (conducta concluyente).','Art. 72 CPACA');
P('cpaca','En el procedimiento administrativo general, el término para interponer los recursos de reposición y apelación es:',
['Dentro de los 10 días siguientes a la notificación.','Dentro de los 2 meses siguientes.','Dentro de los 5 días siguientes.'],0,'Art. 76 CPACA (en materia tributaria rige el recurso de reconsideración, 2 meses).','Art. 76 CPACA');
P('cpaca','El recurso que procede cuando se rechaza el de apelación es el de:',['Reposición.','Queja.','Revocatoria directa.'],1,'El recurso de queja procede contra la decisión que rechaza la apelación.','Art. 74 CPACA');
P('cpaca','¿Cuál recurso NO es obligatorio para acudir a la jurisdicción contencioso administrativa?',
['La apelación, cuando procede.','La reposición.','Ninguno; todos son obligatorios.'],1,'Los recursos de reposición y queja no son obligatorios.','Art. 76 CPACA');
P('cpaca','Los recursos en el procedimiento administrativo general se conceden en el efecto:',['Devolutivo.','Suspensivo.','Diferido.'],1,'Art. 79 CPACA.','Art. 79 CPACA');
P('cpaca','Transcurridos tres meses desde la presentación de una petición sin que se haya notificado decisión, se configura, como regla general:',
['El silencio administrativo negativo.','El silencio administrativo positivo.','La pérdida de competencia de la autoridad.'],0,'Art. 83 CPACA. El silencio positivo solo opera cuando la ley lo prevé.','Arts. 83-84 CPACA');
P('cpaca','Transcurridos dos meses desde la interposición de un recurso de reposición o apelación sin decisión notificada, se entiende que:',
['La decisión es negativa.','La decisión es positiva.','El recurso caducó.'],0,'Silencio negativo en recursos (art. 86).','Art. 86 CPACA');
P('cpaca','Un acto administrativo pierde su fuerza ejecutoria, entre otras causas, cuando:',
['Al cabo de cinco años de estar en firme, la autoridad no ha realizado los actos para ejecutarlo.','El interesado manifiesta su desacuerdo.','Cambia el funcionario que lo expidió.'],0,'Es una de las causales del art. 91 del CPACA.','Art. 91 CPACA');
P('cpaca','Un acto administrativo queda en firme, entre otros casos:',
['Desde el día siguiente al vencimiento del término para interponer recursos si estos no fueron interpuestos.','Desde que se firma por el funcionario.','Desde que el interesado lo cumple voluntariamente.'],0,'Art. 87 numeral 3 del CPACA.','Art. 87 CPACA');
P('cpaca','La manifestación de inconformidad de un ciudadano por la conducta de un servidor público durante la atención se denomina:',
['Reclamo.','Queja.','Sugerencia.'],1,'Queja: sobre la conducta de servidores. Reclamo: sobre la prestación indebida de un servicio o la falta de atención de una solicitud.','Sistema PQRSF');
P('cpaca','La autoridad debe garantizar atención personal al público, como mínimo, durante:',['30 horas a la semana.','40 horas a la semana.','48 horas a la semana.'],1,'Art. 7 num. 2 CPACA.','Art. 7 CPACA');
P('cpaca','Las actuaciones administrativas pueden iniciarse:',
['Solo de oficio.','Por quienes ejerzan el derecho de petición, por quienes obren en cumplimiento de una obligación o deber legal, o de oficio.','Solo a petición de parte.'],1,'Art. 4 CPACA.','Art. 4 CPACA');

// ===================== CONSTITUCIÓN =====================
P('const','Durante una visita, un contribuyente se niega a mostrar sus libros de contabilidad alegando su derecho a la intimidad. Según la Constitución:',
['Tiene razón: los libros son documentos privados inviolables en todo caso.','Para efectos tributarios puede exigirse la presentación de libros de contabilidad y documentos privados, en los términos de la ley.','Solo un juez puede ordenar su exhibición.'],1,'Art. 15 inciso final C.P.','Art. 15 C.P.');

(function(){
'use strict';
const T = window.TEMAS, BANK = window.BANK, EX = window.EXAMEN;
const TM = Object.fromEntries(T.map(t=>[t.id,t]));
const FUNC = T.filter(t=>t.peso>0).map(t=>t.id);
const CONDUCT = ['comp','integ'];
const PRACT_W = Object.assign({}, Object.fromEntries(T.map(t=>[t.id,t.peso||7])));
const KEY = 'dian2676-gestorII-v1';
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- estado ----------
let S = load();
function blank(){ return {qs:{}, sims:[], likert:[], hist:[], started:Date.now()}; }
function load(){ try{ const r=localStorage.getItem(KEY); if(r) return Object.assign(blank(), JSON.parse(r)); }catch(e){} return blank(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function rec(q, ok){
  const r = S.qs[q.id] || {n:0,ok:0,box:0,last:0,wrong:0};
  r.n++; if(ok){ r.ok++; r.box=Math.min(4,r.box+1);} else { r.wrong++; r.box=0; }
  r.last = Date.now(); S.qs[q.id]=r;
  const d=today(); let h=S.hist.find(x=>x.d===d); if(!h){h={d,n:0,ok:0};S.hist.push(h);} h.n++; if(ok)h.ok++;

// ---------- motor adaptativo ----------
function topicStats(t){
  const qs = BANK.filter(q=>q.t===t);
  let n=0, ok=0, seen=0, mastered=0;
  qs.forEach(q=>{ const r=S.qs[q.id]; if(r){ n+=r.n; ok+=r.ok; seen++; if(r.box>=2) mastered++; } });
  // incluye resultados de simulacros (ya registrados por pregunta)
  const acc = n ? ok/n : null;
  const mastery = (mastered + 0.5*(seen-mastered)*(acc??0)) / qs.length; // 0..1
  return {total:qs.length, n, ok, seen, mastered, acc, mastery};
}
function priority(t){
  const st = topicStats(t);
  const weak = st.acc===null ? 0.75 : (1 - st.acc);
  return PRACT_W[t] * (0.35 + weak) * (1.15 - st.mastery);
}
function ranking(){
  return T.map(t=>({id:t.id, p:priority(t.id), st:topicStats(t.id)})).sort((a,b)=>b.p-a.p);
}
function qWeight(q){
  const r=S.qs[q.id];
  if(!r) return 2.2;
  const hrs = (Date.now()-r.last)/36e5;
  const boxF = [3.2,1.6,0.9,0.5,0.25][r.box];
  const fresh = hrs<0.2 ? 0.05 : Math.min(1.5, 0.4 + hrs/24);
  return boxF*fresh*(r.wrong>r.ok?1.4:1);
}
function wpick(arr, wf, n){
  const pool=arr.slice(), out=[];
  while(out.length<n && pool.length){
    const ws=pool.map(wf), tot=ws.reduce((a,b)=>a+b,0); let x=Math.random()*tot, i=0;
    for(;i<pool.length;i++){ x-=ws[i]; if(x<=0) break; }
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return out;
}
function adaptiveSet(n, onlyTopics){
  const tops = onlyTopics || T.map(t=>t.id);
  const pr = Object.fromEntries(tops.map(t=>[t,priority(t)]));
  const cand = BANK.filter(q=>tops.includes(q.t));
  return wpick(cand, q=>pr[q.t]*qWeight(q), n);
}
function simSet(n){
  const nf = Math.round(n*0.8), nc = n-nf;
  const totW = FUNC.reduce((a,t)=>a+TM[t].peso,0);
  let out=[];
  FUNC.forEach(t=>{ const k=Math.max(1,Math.round(nf*TM[t].peso/totW)); out=out.concat(wpick(BANK.filter(q=>q.t===t),()=>1,k)); });
  out = out.slice(0,nf);
  out = out.concat(wpick(BANK.filter(q=>CONDUCT.includes(q.t)),()=>1,nc));
  return out;
}
function shuffleOpts(q){
  const idx=[0,1,2].sort(()=>Math.random()-0.5);
  return {q, opts:idx.map(i=>q.o[i]), correct:idx.indexOf(q.a)};
}

function startQuiz(list, mode, title){
  if(!list.length){ $('#main').insertAdjacentHTML('afterbegin','<p class="note">No hay preguntas para esa selección todavía.</p>'); return; }
  session={mode, title, items:list.map(shuffleOpts), i:0, ans:[], t0:Date.now()};
  if(mode==='sim'){ session.limit = Math.round(list.length*1.5*60); }
  view='quiz'; drawQ();
}
function drawQ(){
  const s=session, it=s.items[s.i], q=it.q, m=$('#main');
  const a=s.ans[s.i];
  const showFb = s.mode!=='sim' && a!==undefined;
  m.innerHTML = `
  <div class="qtop"><span class="mono">${esc(s.title)} · ${s.i+1}/${s.items.length}</span>
   ${s.mode==='sim'?'<span id="clock" class="mono clock"></span>':''}
   <button class="link" id="qquit">${s.mode==='sim'?'Terminar y calificar':'Salir'}</button></div>
  <div class="prog">${bar((s.i)/s.items.length)}</div>
  <article class="qcard">
   <div class="qtag">${TM[q.t].icon} ${esc(TM[q.t].nombre)}</div>
   <p class="qtext">${esc(q.q)}</p>
   <div class="opts">${it.opts.map((o,k)=>{
     let cls=''; if(showFb){ if(k===it.correct) cls='right'; else if(k===a) cls='wrong'; } else if(a===k) cls='sel';
     return `<button class="opt ${cls}" data-k="${k}" ${showFb?'disabled':''}><span class="L">${'ABC'[k]}</span><span>${esc(o)}</span></button>`;}).join('')}</div>
   ${showFb?`<div class="fb ${a===it.correct?'ok':'bad'}"><b>${a===it.correct?'Correcto.':'Incorrecto.'}</b> ${esc(q.e)} ${q.r?`<span class="ref mono">${esc(q.r)}</span>`:''}</div>`:''}
  </article>
  <div class="qnav">
   <button class="btn" id="qprev" ${s.i===0?'disabled':''}>← Anterior</button>
   ${s.i<s.items.length-1?`<button class="btn primary" id="qnext" ${(s.mode!=='sim'&&a===undefined)?'disabled':''}>Siguiente →</button>`:`<button class="btn primary" id="qend">${s.mode==='sim'?'Calificar simulacro':'Ver resultado'}</button>`}
  </div>
  ${s.mode==='sim'?`<div class="grid-nav">${s.items.map((_,k)=>`<button class="gn ${s.ans[k]!==undefined?'done':''} ${k===s.i?'cur':''}" data-j="${k}">${k+1}</button>`).join('')}</div>`:''}`;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(s.mode==='sim'){ s.ans[s.i]=k; drawQ(); }
    else if(s.ans[s.i]===undefined){ s.ans[s.i]=k; rec(q, k===it.correct); drawQ(); }
  });
  const nx=$('#qnext'); if(nx) nx.onclick=()=>{s.i++;drawQ();};
  const pv=$('#qprev'); if(pv) pv.onclick=()=>{s.i--;drawQ();};
  const en=$('#qend'); if(en) en.onclick=finish;
  $('#qquit').onclick=()=> s.mode==='sim'?finish():go('inicio');
  m.querySelectorAll('.gn').forEach(b=>b.onclick=()=>{s.i=+b.dataset.j;drawQ();});
  if(s.mode==='sim') tick();
  window.scrollTo(0,0);
}
function tick(){
  clearInterval(timer);
  const upd=()=>{ const left=session.limit-Math.floor((Date.now()-session.t0)/1000); const c=$('#clock'); if(!c) return;
    if(left<=0){ clearInterval(timer); finish(); return; }
    c.textContent=`${Math.floor(left/3600)}:${String(Math.floor(left%3600/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`; c.classList.toggle('late', left<300); };
  upd(); timer=setInterval(upd,1000);
}
function finish(){
  clearInterval(timer);
  const s=session; const per={}; let fOk=0,fN=0,cOk=0,cN=0;
  s.items.forEach((it,k)=>{
    const ok = s.ans[k]===it.correct; const t=it.q.t;
    if(s.mode==='sim') rec(it.q, ok);
    per[t]=per[t]||[0,0]; per[t][1]++; if(ok) per[t][0]++;
    if(CONDUCT.includes(t)){cN++; if(ok)cOk++;} else {fN++; if(ok)fOk++;}
  });
  const func = fN?Math.round(fOk/fN*100):0, cond = cN?Math.round(cOk/cN*100):null;
  if(s.mode==='sim'){ S.sims.push({t:Date.now(), n:s.items.length, func, cond, per, mins:Math.round((Date.now()-s.t0)/60000)}); save(); }
  const wrong = s.items.map((it,k)=>({it,a:s.ans[k]})).filter(x=>x.a!==x.it.correct);
  const weakT = Object.entries(per).map(([t,[o,n]])=>({t,acc:o/n,n})).sort((a,b)=>a.acc-b.acc);
  const m=$('#main'); view='result';
  m.innerHTML = `
  <div class="bh"><h1 class="h1s">Resultado · ${esc(s.title)}</h1></div>
  <section class="result">
   <div class="score ${func>=70?'ok':'bad'}"><span class="mono">${fN?func:'—'}</span><small>${fN?'Competencias funcionales / 100':''}</small><b>${fN?(func>=70?'Superas el mínimo de 70':'Por debajo del mínimo de 70'):''}</b></div>
   ${cond!==null?`<div class="score sm"><span class="mono">${cond}</span><small>Casos comportamentales e integridad</small></div>`:''}
  </section>
  <section class="block"><h2>Por tema</h2><div class="tbl"><table><tbody>
   ${weakT.map(w=>`<tr><td>${TM[w.t].icon} ${esc(TM[w.t].nombre)}</td><td class="mono">${Math.round(w.acc*w.n)}/${w.n}</td><td>${bar(w.acc, w.acc>=.75?'g':w.acc>=.55?'y':'r')}</td><td><button class="link" data-go="tema" data-arg="${w.t}">Ficha →</button></td></tr>`).join('')}
  </tbody></table></div>
  <p class="note">Tu plan de estudio ya se ajustó: la práctica adaptativa priorizará ${weakT.filter(w=>w.acc<.75).slice(0,3).map(w=>TM[w.t].nombre).join(', ')||'mantener lo que dominas'}.</p>
  <div class="row-actions"><button class="btn primary" id="rfocus">Practicar mis temas débiles</button><button class="btn" data-go="inicio">Volver al inicio</button></div></section>
  ${wrong.length?`<section class="block"><h2>Revisión de errores (${wrong.length})</h2>${wrong.map(({it,a})=>`<div class="rev"><p class="qtext sm">${esc(it.q.q)}</p>
    ${a!==undefined?`<p class="wrongtxt">Tu respuesta: ${esc(it.opts[a])}</p>`:'<p class="wrongtxt">Sin responder</p>'}
    <p class="righttxt">Correcta: ${esc(it.opts[it.correct])}</p><p class="muted">${esc(it.q.e)} <span class="ref mono">${esc(it.q.r)}</span></p></div>`).join('')}</section>`:''}`;
  $('#rfocus').onclick=()=>{ const ts=weakT.filter(w=>w.acc<.8).map(w=>w.t); startQuiz(adaptiveSet(20, ts.length?ts:null),'prac','Refuerzo de temas débiles'); };
  window.scrollTo(0,0);
}

// ---------- Likert ----------
const LOPT=['Totalmente en desacuerdo','En desacuerdo','De acuerdo','Totalmente de acuerdo'];
function vLikertIntro(){
  const last=S.likert[S.likert.length-1];
  return `<div class="bh"><h1 class="h1s">Entrenador Likert</h1></div>
  <p class="lead">La prueba real de Comportamentales e Integridad es un autoinforme: lees afirmaciones y marcas qué tan de acuerdo estás. No hay respuestas "de memoria"; lo que se mide es tu perfil y su coherencia.</p>
  <section class="ficha"><h2>Cómo se lee este entrenamiento</h2><ul>
   <li><b>Ítems directos e invertidos:</b> algunas frases describen una conducta deseable y otras su opuesto. Si estás de acuerdo con ambas, tu perfil es inconsistente.</li>
   <li><b>Ítems de control:</b> frases absolutas e irreales ("nunca he mentido"). Marcar "Totalmente de acuerdo" en ellas indica deseabilidad social, que la prueba real detecta.</li>
   <li>Responde como actuarías de verdad, con apego a los principios del servicio público. Ser realista no te resta; exagerar sí puede afectar qué ítems se califican.</li></ul></section>
  <div class="row-actions"><button class="btn primary" id="lstart">Empezar (${window.LIKERT.length} afirmaciones, ~5 min)</button></div>
  ${last?`<section class="block"><h2>Último resultado</h2>${likertReport(last)}</section>`:''}`;
}
function startLikert(){
  const items = window.LIKERT.map((x,i)=>({...x,i})).sort(()=>Math.random()-0.5);
  const ans={}; const m=$('#main');
  m.innerHTML = `<div class="bh"><h1 class="h1s">Autoinforme</h1></div><p class="muted">Marca una opción en cada afirmación.</p>
  <div class="lk">${items.map((it,k)=>`<fieldset class="lki"><legend><span class="mono">${k+1}.</span> ${esc(it.t)}</legend>
   <div class="lko">${LOPT.map((o,v)=>`<label><input type="radio" name="lk${it.i}" id="lk${it.i}_${v}" value="${v}"><span>${o}</span></label>`).join('')}</div></fieldset>`).join('')}</div>
  <div class="row-actions"><button class="btn primary" id="lend">Ver mi perfil</button></div><p id="lmsg" class="muted" role="status"></p>`;
  m.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{ ans[r.name.slice(2)]=+r.value; });
  $('#lend').onclick=()=>{
    if(Object.keys(ans).length<window.LIKERT.length){ $('#lmsg').textContent=`Te faltan ${window.LIKERT.length-Object.keys(ans).length} afirmaciones por responder.`; return; }
    const res={t:Date.now(), a:ans}; S.likert.push(res); save();
    m.innerHTML = `<div class="bh"><h1 class="h1s">Tu perfil</h1></div>${likertReport(res)}<div class="row-actions"><button class="btn" data-go="likert">Volver</button></div>`;
    window.scrollTo(0,0);
  };
}
function likertReport(res){
  const L=window.LIKERT, C=window.LIKERT_COMP, a=res.a;
  const by={}; let ctrlHi=0, ctrlN=0; const pairs={};
  L.forEach((it,i)=>{ const v=a[i]; if(v===undefined) return;
    if(it.ctrl){ ctrlN++; if(v===3) ctrlHi++; return; }
    const sc = it.inv ? 3-v : v; (by[it.c]=by[it.c]||[]).push(sc);
    if(it.par){ (pairs[it.par]=pairs[it.par]||[]).push({inv:!!it.inv, v}); }
  });
  let incons=[];
  Object.entries(pairs).forEach(([p,arr])=>{ if(arr.length===2){ const d=arr.find(x=>!x.inv), r=arr.find(x=>x.inv); if(d&&r&&d.v>=2&&r.v>=2) incons.push(p);} });
  const flag = ctrlHi>=2;
  return `<div class="tbl"><table><thead><tr><th>Competencia</th><th>Perfil</th><th></th></tr></thead><tbody>
  ${Object.entries(by).map(([c,arr])=>{const m=arr.reduce((x,y)=>x+y,0)/(arr.length*3);return `<tr><td>${esc(C[c])}</td><td>${bar(m, m>=.75?'g':m>=.5?'y':'r')}</td><td class="mono">${Math.round(m*100)}</td></tr>`;}).join('')}
  </tbody></table></div>
  <div class="fb ${flag?'bad':'ok'}"><b>Escala de control:</b> marcaste "Totalmente de acuerdo" en ${ctrlHi} de ${ctrlN} afirmaciones absolutas. ${flag?'Este patrón se lee como respuesta exageradamente favorable. En el examen, ante frases con "nunca", "siempre" o "jamás" que nadie cumple al 100 %, responde con realismo.':'Bien: respondes con realismo ante afirmaciones absolutas.'}</div>
  <div class="fb ${incons.length?'bad':'ok'}"><b>Consistencia:</b> ${incons.length?`estuviste de acuerdo con afirmaciones opuestas en ${incons.length} par(es). Revisa con calma: si apoyas "reporto las irregularidades", no deberías apoyar "un error menor no vale la pena reportarlo".`:'tus respuestas a afirmaciones opuestas son coherentes.'}</div>
  <p class="muted">Este entrenador no reproduce la prueba real ni su calificación; sirve para que reconozcas el formato y revises tu coherencia.</p>`;
}

// ---------- enlaces de eventos por vista ----------
function bindView(arg){
  if(view==='tema'){
    $('#tp10').onclick=()=>startQuiz(adaptiveSet(10,[arg]),'prac',TM[arg].nombre);
    $('#tpall').onclick=()=>startQuiz(BANK.filter(q=>q.t===arg).sort(()=>Math.random()-0.5),'prac',TM[arg].nombre);
    $('#tperr').onclick=()=>startQuiz(BANK.filter(q=>q.t===arg && S.qs[q.id] && S.qs[q.id].box===0),'prac',TM[arg].nombre+' · errores');
  }
  if(view==='practicar'){
    document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>startQuiz(adaptiveSet(+b.dataset.n),'prac','Práctica adaptativa'));
    $('#perr').onclick=()=>startQuiz(BANK.filter(q=>S.qs[q.id] && S.qs[q.id].box===0).sort(()=>Math.random()-0.5).slice(0,30),'prac','Repaso de errores');
  }
  if(view==='simulacro') document.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>startQuiz(simSet(+b.dataset.sim),'sim',`Simulacro ${b.dataset.sim}`));
  if(view==='likert') $('#lstart').onclick=startLikert;
  if(view==='progreso'){
    $('#exp').onclick=()=>{ const code=btoa(unescape(encodeURIComponent(JSON.stringify(S)))); const ta=$('#code'); ta.value=code;
      const done=()=>$('#msg').textContent='Código copiado. Pégalo en la app desde tu otro dispositivo.';
      try{ navigator.clipboard.writeText(code).then(done,()=>{ta.select();$('#msg').textContent='Selecciona y copia el código del cuadro.';}); }catch(e){ ta.select(); $('#msg').textContent='Selecciona y copia el código del cuadro.'; } };
    $('#imp').onclick=()=>{ try{ const o=JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim())))); if(!o.qs) throw 0; S=Object.assign(blank(),o); save(); $('#msg').textContent='Progreso cargado.'; setTimeout(()=>go('progreso'),600);}catch(e){ $('#msg').textContent='Ese código no es válido. Cópialo completo desde la opción "Copiar código de progreso".'; } };
    let armed=false; $('#rst').onclick=e=>{ if(!armed){armed=true; e.target.textContent='Toca otra vez para confirmar'; return;} S=blank(); save(); go('progreso'); };
  }
}

go('inicio');
})();
</script>
