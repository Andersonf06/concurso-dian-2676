<!doctype html>

<head>

<title>Expediente DIAN 2676</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: expediente de fiscalización — barra lateral de folios a la izquierda, hoja de trabajo a la derecha; en móvil, pestañas inferiores. */
:root{
  --paper:#f3f5f4; --sheet:#ffffff; --ink:#14232f; --muted:#5b6b74; --line:#d6dedd;
  --accent:#0f5c63; --accent-ink:#ffffff; --accent-soft:#dcebea;
  --seal:#b23a2c; --seal-soft:#f6e1dd; --ok:#22744a; --ok-soft:#dcefe3; --warn:#a86a07; --warn-soft:#f6ead2;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f1719; --sheet:#162125; --ink:#e4ecec; --muted:#93a5aa; --line:#2a393d;
  --accent:#5fb7b5; --accent-ink:#06201f; --accent-soft:#1d3a3c;
  --seal:#ee7f6f; --seal-soft:#3a1f1b; --ok:#6fcf98; --ok-soft:#173326; --warn:#e2b25a; --warn-soft:#352812; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0f1719; --sheet:#162125; --ink:#e4ecec; --muted:#93a5aa; --line:#2a393d;
  --accent:#5fb7b5; --accent-ink:#06201f; --accent-soft:#1d3a3c;
  --seal:#ee7f6f; --seal-soft:#3a1f1b; --ok:#6fcf98; --ok-soft:#173326; --warn:#e2b25a; --warn-soft:#352812; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.55 var(--body);margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--sheet);display:flex;flex-direction:column;gap:20px;padding:24px 16px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.brand{font:800 20px/1.1 var(--display);letter-spacing:-.01em}
.brand small{display:block;font:500 11px/1.4 var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:6px;display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--accent-soft);color:var(--ink)}
.nav button.on{background:var(--accent);color:var(--accent-ink)}
.nav button:focus-visible,.btn:focus-visible,.opt:focus-visible,.trow:focus-visible,.card:focus-visible,.planitem:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side .foot{margin-top:auto;font:500 11px/1.5 var(--mono);color:var(--muted)}
main{padding-block:32px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:900px;width:100%;margin:0 auto;min-width:0}
h1,h2{font-family:var(--display);text-wrap:balance;letter-spacing:-.015em;margin:0}
h1{font-size:clamp(34px,6vw,56px);font-weight:800;line-height:1}
h1 em{font-style:normal;color:var(--seal)}
.h1s{font-size:clamp(26px,4vw,34px);font-weight:800}
h2{font-size:19px;font-weight:600}
.eyebrow{font:500 11px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:12px}
.lead{color:var(--muted);max-width:65ch;margin:12px 0 0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:end;padding-bottom:28px;border-bottom:2px solid var(--ink)}
.kpis{display:grid;gap:8px}
.kpi{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:0 12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font:600 26px/1 var(--mono);grid-row:span 2}
.kpi small{font-size:12px;color:var(--muted)}
.ok{color:var(--ok)} .bad{color:var(--seal)}
.block{margin-top:36px;display:grid;gap:14px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:p}
.planitem{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;box-sizing:border-box;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.planitem::before{counter-increment:p;content:counter(p);grid-row:span 2;font:600 13px var(--mono);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.planitem b{font-weight:600}.planitem span{color:var(--muted);font-size:13px;grid-column:2}
.planitem i{grid-row:1/span 2;grid-column:3;font-style:normal;color:var(--accent)}
.planitem:hover{border-color:var(--accent)}
.tlist{display:grid;border-top:1px solid var(--line)}
.trow{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) minmax(90px,30%);gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.trow:hover{background:var(--accent-soft)}
.tn{display:grid;min-width:0}.tn small{color:var(--muted);font-size:12px}
.ti{font-size:18px}
.bar{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.g i{background:var(--ok)}.bar.y i{background:var(--warn)}.bar.r i{background:var(--seal)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cards.three{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:20px}
.card{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:16px}
.card:hover{border-color:var(--accent)}
.card small{color:var(--muted);font-size:12px}
.card .big{font-size:40px;line-height:1;color:var(--accent)}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:500;font-size:14px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:10px 16px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--seal)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accent-soft);border-radius:999px;padding:5px 12px;font-size:13px}
.ficha{margin-top:24px;background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:20px 22px}
.ficha ul{margin:12px 0 0;padding-left:20px;display:grid;gap:10px;max-width:72ch}
.qtop{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.clock{font-size:18px;color:var(--ink)} .clock.late{color:var(--seal)}
.prog{margin:12px 0 20px}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,4vw,30px)}
.qtag{font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:12px}
.qtext{font-size:18px;line-height:1.5;margin:0 0 20px;max-width:68ch}
.qtext.sm{font-size:15px;margin-bottom:8px;font-weight:500}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.opt .L{font:600 14px/32px var(--mono);text-align:center;border-radius:50%;background:var(--sheet);border:1px solid var(--line);height:32px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--seal);background:var(--seal-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:6px;background:var(--ok-soft)}
.fb.bad{background:var(--seal-soft)}
.ref{display:inline-block;margin-left:6px;font-size:12px;color:var(--muted)}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.grid-nav{display:flex;flex-wrap:wrap;gap:4px;margin-top:20px}
.gn{width:34px;height:30px;border:1px solid var(--line);background:var(--sheet);border-radius:4px;font:500 12px var(--mono);cursor:pointer}
.gn.done{background:var(--accent-soft)}.gn.cur{border-color:var(--ink);border-width:2px}
.result{display:flex;flex-wrap:wrap;gap:16px;margin-top:20px}
.score{flex:1 1 220px;border:2px solid currentColor;border-radius:8px;padding:20px;display:grid;gap:4px;background:var(--sheet)}
.score span{font-size:64px;line-height:1}
.score small{color:var(--muted)}
.score.ok{color:var(--ok)}.score.bad{color:var(--seal)}.score.sm{color:var(--ink);border-color:var(--line);border-width:1px}
.score.sm span{font-size:40px}
.note{background:var(--warn-soft);padding:12px 14px;border-radius:6px}
.rev{border-top:1px solid var(--line);padding-top:12px}
.wrongtxt{color:var(--seal);margin:4px 0}.righttxt{color:var(--ok);margin:4px 0;font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td:last-child .bar{min-width:80px}
.chart svg{width:100%;height:auto;max-width:640px}
.gl{stroke:var(--line);stroke-width:1}.gl70{stroke:var(--seal);stroke-dasharray:4 4;stroke-width:1.2}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5}
.dot.ok{fill:var(--ok)}.dot.bad{fill:var(--seal)}
.ax{fill:var(--muted);font:11px var(--mono)}
.days{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.day{display:grid;justify-items:center;gap:2px;min-width:38px}
.day i{display:block;width:18px;background:var(--accent);border-radius:3px 3px 0 0}
.day small{font-size:10px;color:var(--muted)}
textarea{width:100%;font:12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--sheet);color:var(--ink);margin-top:10px}
.lk{display:grid;gap:12px;margin-top:16px}
.lki{border:1px solid var(--line);border-radius:8px;background:var(--sheet);padding:14px;margin:0;min-width:0}
.lki legend{padding:0 4px;font-weight:500}
.lko{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.lko label{display:block;cursor:pointer}
.lko input{position:absolute;opacity:0}
.lko span{display:block;text-align:center;font-size:12px;padding:8px 4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);height:100%}
.lko input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lko input:focus-visible+span{outline:2px solid var(--accent)}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:20;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line)}
  .brand,.side .foot{display:none}
  .nav{flex-direction:row;justify-content:space-between;width:100%;gap:2px}
  .nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 4px;flex:1;justify-content:center;text-align:center}
  .nav .nl{display:block}
  .hero{grid-template-columns:minmax(0,1fr)}
  .lko{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trow{grid-template-columns:24px minmax(0,1fr) 70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>// Temas alineados a la ficha AT-FL-3007 (Gestor II 302-02, Fiscalización y Liquidación)
// peso = participación estimada en los simulacros (suma 100)
window.TEMAS = [
 {id:'fisc', nombre:'Fiscalización y determinación tributaria', grupo:'Funcional específica', peso:20, icon:'🔎',
  eje:'Competencia funcional 1: La determinación y el control tributario · Eje 17',
  ficha:[
  'Facultades de fiscalización (art. 684 ET): verificar exactitud de declaraciones, investigar hechos generadores no declarados, citar o requerir a terceros, exigir libros y soportes, ordenar inspecciones tributarias y contables.',
  'Requerimiento ordinario (art. 686 ET): pide información; plazo de respuesta no inferior a 15 días calendario. No es acto previo obligatorio.',
  'Emplazamiento para corregir (art. 685 ET): facultativo; da 1 mes para corregir con sanción por corrección del 20 %. No responderlo no genera sanción. Suspende 1 mes el término para notificar el requerimiento especial.',
  'Requerimiento especial (arts. 702-705 ET): acto previo OBLIGATORIO a la liquidación oficial de revisión. Se notifica dentro de los 3 años siguientes al vencimiento del plazo para declarar (si la declaración fue extemporánea, desde su presentación).',
  'Respuesta al requerimiento especial: 3 meses (art. 707 ET). Ampliación del requerimiento: dentro de los 3 meses siguientes al vencimiento del plazo para responder (art. 708); respuesta a la ampliación entre 3 y 6 meses.',
  'Suspensión del término (art. 706 ET): inspección tributaria de oficio → 3 meses; inspección a solicitud del contribuyente → mientras dure; emplazamiento para corregir → 1 mes.',
  'Liquidación oficial de revisión (art. 710 ET): dentro de los 6 meses siguientes al vencimiento del término para responder el requerimiento o su ampliación. Debe haber correspondencia con el requerimiento (art. 711).',
  'Aceptación de hechos: en la respuesta al requerimiento la sanción por inexactitud se reduce a la cuarta parte (art. 709); tras la liquidación de revisión, dentro del término para el recurso, se reduce a la mitad (art. 713).',
  'Omisos: emplazamiento para declarar (art. 715 ET) con 1 mes para declarar → si no declara: sanción por no declarar (art. 643) y liquidación de aforo dentro de los 5 años siguientes al vencimiento del plazo (art. 717).',
  'Firmeza (art. 714 ET): regla general 3 años desde el vencimiento del plazo para declarar; declaraciones con pérdidas fiscales o sujetas a precios de transferencia: 5 años.',
  'Corrección que aumenta el impuesto (art. 588 ET): dentro de los 3 años siguientes al vencimiento y antes de que se notifique requerimiento especial o pliego de cargos, liquidando sanción por corrección.',
  'Declaración no presentada (art. 580 ET): sin identificación del declarante, sin factores para identificar bases gravables, sin firma del obligado, o sin firma de contador/revisor fiscal cuando es obligatoria.',
  'Régimen probatorio: los hechos consignados en las declaraciones se presumen ciertos (art. 746); los vacíos probatorios se resuelven a favor del contribuyente cuando no está obligado a probar (art. 745).',
  'Inspección tributaria (art. 779 ET): medio de prueba para verificar exactitud; se decreta por auto y se levanta acta. Inspección contable (art. 782): acta firmada, copia al contribuyente.',
  'Recurso de reconsideración (art. 720 ET): 2 meses desde la notificación. La DIAN tiene 1 año para resolverlo (art. 732); si no lo hace, opera el silencio administrativo POSITIVO (art. 734).',
  'Abuso en materia tributaria (art. 869 ET): uso de operaciones artificiales sin propósito comercial para obtener un beneficio tributario; la DIAN puede recaracterizarlas.',
  'Devoluciones: solicitud dentro de los 2 años siguientes al vencimiento del plazo para declarar (art. 854); la DIAN resuelve en 50 días hábiles (art. 855), 20 días con garantía (art. 860).',
  'Cobro: la acción de cobro prescribe en 5 años (art. 817 ET). Intereses moratorios: tasa de usura menos 2 puntos (art. 635).'
 ]},
 {id:'sanc', nombre:'Régimen sancionatorio tributario', grupo:'Funcional específica', peso:9, icon:'⚖️',
  eje:'Competencia funcional 1 · Proferir actos administrativos (función 4)',
  ficha:[
  'Sanción mínima: 10 UVT (art. 639 ET).',
  'Extemporaneidad antes de emplazamiento (art. 641): 5 % del impuesto por mes o fracción, máximo 100 %. Después del emplazamiento (art. 642): 10 % por mes, máximo 200 %.',
  'No declarar (art. 643): en renta, 20 % del valor de las consignaciones o de los ingresos brutos (el mayor). Si declara dentro del término para recurrir la resolución sanción, se reduce al 50 %.',
  'Corrección (art. 644): 10 % del mayor valor a pagar; 20 % si se corrige después de notificado el emplazamiento para corregir o el auto de inspección.',
  'Inexactitud (art. 647): omisión de ingresos, costos o deducciones inexistentes, datos falsos, retenciones no efectuadas. NO hay inexactitud por diferencia de criterio sobre el derecho aplicable si los hechos son completos y verdaderos.',
  'Sanción por inexactitud (art. 648): regla general 100 % de la diferencia entre el saldo a pagar determinado por la DIAN y el declarado.',
  'Sanciones en resolución independiente: requieren pliego de cargos previo y oportunidad de respuesta (art. 637-638 ET).',
  'Clausura del establecimiento (art. 657): por no facturar u otras causales; sello "CERRADO POR EVASIÓN".',
  'Principios sancionatorios (art. 197 Ley 1607 / art. 640 ET): legalidad, lesividad, favorabilidad, proporcionalidad y gradualidad.',
  'Proveedores ficticios (art. 671): los costos y deducciones soportados en operaciones con ellos no son aceptados y se sanciona al usuario.'
 ]},
 {id:'sist', nombre:'Generalidades del sistema tributario', grupo:'Funcional específica', peso:7, icon:'🏛️',
  eje:'Eje 16: Generalidades al sistema tributario, aduanero y cambiario',
  ficha:[
  'Elementos del tributo (art. 338 C.P.): sujeto activo, sujeto pasivo, hecho generador, base gravable y tarifa.',
  'Obligación sustancial: pagar el tributo; obligaciones formales: declarar, inscribirse en el RUT, facturar, informar, llevar contabilidad.',
  'Tributos nacionales administrados por la DIAN: renta y complementarios, IVA, impuesto al consumo, timbre, GMF, patrimonio, carbono, retención en la fuente, tributos aduaneros. ICA y predial son municipales.',
  'IVA (art. 420 ET): hechos generadores — venta de bienes, prestación de servicios, importación de bienes y juegos de suerte y azar. Tarifa general 19 % (art. 468).',
  'Exentos vs excluidos: los exentos están gravados a tarifa 0 % y dan derecho a impuestos descontables/devolución; los excluidos no causan IVA.',
  'Retención en la fuente (art. 367): mecanismo de recaudo anticipado del impuesto en el mismo ejercicio en que se causa.',
  'Residencia fiscal persona natural (art. 10): permanecer más de 183 días calendario (continuos o discontinuos) en un periodo de 365 días.',
  'RUT (art. 555-2): mecanismo único para identificar, ubicar y clasificar a los sujetos de obligaciones administradas por la DIAN.',
  'Facturación electrónica (art. 616-1): validación previa por la DIAN.',
  'Régimen Simple de Tributación (art. 903 y ss.): modelo opcional que integra renta, consumo e ICA consolidado.'
 ]},
 {id:'adua', nombre:'Fiscalización aduanera', grupo:'Funcional específica', peso:14, icon:'🚢',
  eje:'Competencia funcional 4: Fiscalización aduanera · Función 9 (destrucción de mercancías)',
  ficha:[
  'Marco: Ley 1609 de 2013 (ley marco de aduanas) y Decreto 1165 de 2019. Régimen sancionatorio: el Decreto Ley 920 de 2023 fue declarado inexequible (C-072 de 2025) con efectos diferidos al 20-jun-2026; la Ley 2586 de 2026 (19-jun-2026) adoptó el nuevo régimen. Ojo: el corte normativo del examen es "antes del 19 de junio de 2026".',
  'Control aduanero: previo (antes de la llegada/presentación), simultáneo (durante el proceso de desaduanamiento: inspección física o documental) y posterior (fiscalización después del levante).',
  'Levante: acto por el cual la autoridad aduanera permite la disposición de la mercancía, previo cumplimiento de requisitos.',
  'Regímenes: importación (ordinaria, temporal, en cumplimiento de garantía, reimportación…), exportación (definitiva, temporal…), tránsito aduanero y depósito.',
  'Tránsito: transporte de mercancías bajo control aduanero de una aduana a otra en el territorio, con suspensión de tributos.',
  'Aprehensión: medida cautelar que retiene mercancías sobre las que se configura una causal de decomiso. Decomiso: decisión que transfiere a la Nación la propiedad de la mercancía cuya legal introducción no se acredita.',
  'Valoración aduanera (Acuerdo OMC / Decisión CAN 571): el primer método es el valor de transacción; los demás se aplican en orden sucesivo.',
  'Clasificación arancelaria: Sistema Armonizado; se aplica primero la Regla General Interpretativa 1 (textos de partidas y notas de sección o capítulo).',
  'Firmeza de la declaración aduanera: 3 años desde su aceptación, salvo que se haya notificado requerimiento especial aduanero.',
  'Contrabando: delito (art. 319 C.P., Ley 1762 de 2015) cuando supera 50 SMMLV; por debajo es infracción administrativa con decomiso. Abierto: mercancía que no se presenta a la aduana. Técnico: se presenta pero con irregularidades (subfacturación, clasificación u origen falsos).',
  'Mercancía averiada, defectuosa o impropia: el importador puede solicitar su destrucción; la DIAN participa en la diligencia, verifica identidad y cantidad, y se levanta acta.',
  'OEA (Operador Económico Autorizado): usuario confiable con beneficios de control por cumplir requisitos de seguridad.'
 ]},
 {id:'camb', nombre:'Régimen cambiario', grupo:'Funcional específica', peso:10, icon:'💱',
  eje:'Competencia funcional 2: Régimen cambiario en las operaciones de competencia de la DIAN',
  ficha:[
  'Ley marco: Ley 9 de 1991. Autoridad cambiaria (regula): Junta Directiva del Banco de la República. Regulación operativa: Resolución Externa 1 de 2018 y Circular DCIP-83.',
  'Competencia de la DIAN: vigilar el cumplimiento del régimen cambiario en importaciones y exportaciones de bienes y servicios, sus gastos asociados, su financiación y la sub/sobrefacturación; y las operaciones no asignadas a otra entidad. Supersociedades vigila inversiones internacionales y endeudamiento externo de sus vigiladas.',
  'Operaciones de canalización obligatoria: importaciones y exportaciones de bienes, endeudamiento externo, inversiones de capital del exterior y colombianas en el exterior, inversiones financieras y en activos en el exterior, avales y garantías en moneda extranjera, y derivados.',
  'Servicios, transferencias y otros conceptos son operaciones de "mercado libre": pueden canalizarse voluntariamente.',
  'Se canaliza a través de intermediarios del mercado cambiario (IMC) o de cuentas de compensación registradas ante el Banco de la República.',
  'Régimen sancionatorio y procedimiento: Decreto Ley 2245 de 2011. El acto de formulación de cargos debe notificarse dentro de los 5 años siguientes a la ocurrencia de los hechos (art. 5); es norma especial que prevalece sobre el art. 52 del CPACA.',
  'Infracción continuada: el término corre desde el último hecho; el incumplimiento de plazos NO se considera infracción continuada.',
  'No hay infracción cuando el error puede aclararse o actualizarse en cualquier tiempo según el régimen cambiario.',
  'Inversión extranjera: régimen general en el Decreto 119 de 2017 (compilado en el Decreto 1068 de 2015); se registra ante el Banco de la República.'
 ]},
 {id:'intl', nombre:'Fiscalización internacional', grupo:'Funcional específica', peso:8, icon:'🌐',
  eje:'Competencia funcional 3: La fiscalización internacional',
  ficha:[
  'Precios de transferencia (arts. 260-1 y ss. ET): las operaciones con vinculados del exterior deben pactarse como entre independientes (principio de plena competencia).',
  'Obligados a documentación comprobatoria y declaración informativa: contribuyentes con patrimonio bruto ≥ 100.000 UVT o ingresos brutos ≥ 61.000 UVT que tengan operaciones con vinculados (arts. 260-5 y 260-9).',
  'Métodos: precio comparable no controlado, precio de reventa, costo adicionado, partición de utilidades y márgenes transaccionales de utilidad de operación.',
  'Operaciones con jurisdicciones no cooperantes, de baja o nula imposición o regímenes preferenciales quedan sometidas al régimen aunque no haya vinculación (art. 260-7).',
  'Establecimiento permanente (art. 20-1): lugar fijo de negocios en Colombia por el que una empresa extranjera realiza su actividad, o agente dependiente que celebra contratos a su nombre.',
  'Sociedad nacional por sede efectiva de administración (art. 12-1).',
  'ECE – Entidades Controladas del Exterior (arts. 882 y ss.): las rentas pasivas de la ECE se gravan en Colombia en cabeza del residente controlante.',
  'Intercambio de información: Convención Multilateral de Asistencia Administrativa Mutua (Ley 1661 de 2013), estándar CRS (OCDE) y acuerdo FATCA con EE. UU.',
  'Doble imposición: convenios (CDI) y descuento por impuestos pagados en el exterior (art. 254 ET).',
  'Registro Único de Beneficiarios Finales – RUB (Ley 2155 de 2021, Res. DIAN 164 de 2021).',
  'Requisito adicional: los empleos de la Subdirección de Gestión de Fiscalización Internacional exigen inglés B2.'
 ]},
 {id:'evas', nombre:'Evasión, elusión, contrabando y LA/FT', grupo:'Funcional específica', peso:8, icon:'🕵️',
  eje:'Eje 7 · Propósito principal del empleo · Función 3 (ROS de LA/FT)',
  ficha:[
  'Evasión: incumplimiento ilegal (ocultar ingresos, inflar costos). Elusión: aprovechar vacíos o formas legales para reducir la carga. Abuso: operaciones artificiales sin propósito económico (art. 869 ET).',
  'Delitos tributarios del Código Penal: omisión del agente retenedor (art. 402: no consignar retenciones dentro de los 2 meses siguientes al plazo), omisión de activos o inclusión de pasivos inexistentes (art. 434A), defraudación o evasión tributaria (art. 434B).',
  'Lavado de activos (art. 323 C.P.): etapas — colocación, estratificación (ocultamiento) e integración.',
  'Financiación del terrorismo (art. 345 C.P.).',
  'UIAF (Ley 526 de 1999): unidad de inteligencia financiera que recibe y analiza los ROS. El ROS no requiere certeza del delito ni es una denuncia penal, y debe mantenerse en reserva frente al reportado.',
  'Lavado basado en comercio (TBML): sub/sobrefacturación de importaciones o exportaciones, mercancía fantasma, triangulaciones.',
  'Favorecimiento de contrabando (art. 320 C.P.): poseer, transportar o comercializar mercancía de contrabando.',
  'Ley 1712 de 2014 (transparencia y acceso a información pública) y Ley 2195 de 2022 (transparencia, prevención y lucha contra la corrupción; programas de transparencia y ética empresarial).'
 ]},
 {id:'cpaca', nombre:'CPACA y derecho de petición', grupo:'Funcional transversal', peso:9, icon:'📜',
  eje:'Eje 12: Ley 1437 de 2011 (Títulos I, II y III caps. I y V-VIII) · Eje 13 PQRSF',
  ficha:[
  'OJO al alcance del eje: Título I (principios), Título II (petición) y Título III capítulos I (reglas generales), V (notificaciones), VI (recursos), VII (silencio) y VIII (conclusión). NO incluye el sancionatorio (cap. III).',
  'Art. 2: el CPACA aplica sin perjuicio de procedimientos especiales (como el tributario del ET); en lo no previsto se aplica el CPACA.',
  'Principios (art. 3): debido proceso, igualdad, imparcialidad, buena fe, moralidad, participación, responsabilidad, transparencia, publicidad, coordinación, eficacia, economía y celeridad.',
  'Petición (Ley 1755 de 2015, art. 14): regla general 15 días; documentos/información 10 días; consultas 30 días; entre autoridades 10 días (art. 30). Si no se puede responder a tiempo, se informa antes del vencimiento, sin exceder el doble del término inicial.',
  'Petición incompleta (art. 17): se requiere al peticionario dentro de 10 días para que complete en 1 mes (prorrogable hasta 1 mes más); si no lo hace, desistimiento tácito.',
  'Falta de competencia (art. 21): remitir dentro de los 5 días siguientes al recibo e informar al peticionario.',
  'Notificación personal (art. 67); citación dentro de 5 días de la expedición del acto (art. 68); si no comparece en 5 días, notificación por aviso, que se entiende surtida al finalizar el día siguiente a su entrega (art. 69).',
  'Notificación irregular (art. 72): el acto no produce efectos, salvo conducta concluyente del interesado.',
  'Recursos (art. 74): reposición (ante quien decidió), apelación (ante el inmediato superior) y queja (cuando se rechaza la apelación). Plazo: 10 días siguientes a la notificación (art. 76). Reposición y queja no son obligatorios.',
  'Los recursos se conceden en efecto suspensivo (art. 79). Periodo probatorio en recursos: hasta 30 días.',
  'Silencio negativo: 3 meses sin decisión de la petición (art. 83); 2 meses sin decidir recursos (art. 86). Silencio positivo solo cuando la ley lo prevé (art. 84).',
  'Firmeza (art. 87), presunción de legalidad (art. 88), carácter ejecutorio (art. 89) y pérdida de ejecutoria (art. 91: suspensión/anulación, desaparición de fundamentos, 5 años sin ejecutar, condición resolutoria, pérdida de vigencia).',
  'PQRSF: Petición, Queja (inconformidad con la conducta de un servidor), Reclamo (prestación deficiente del servicio), Sugerencia y Felicitación (también Denuncia).'
 ]},
 {id:'const', nombre:'Constitución Política', grupo:'Funcional transversal', peso:6, icon:'🇨🇴',
  eje:'Eje 15: Derechos fundamentales, principios y estructura del Estado',
  ficha:[
  'Art. 1 Estado social de derecho; art. 2 fines esenciales del Estado.',
  'Art. 6: los particulares responden por infringir la Constitución y las leyes; los servidores públicos además por omisión o extralimitación de funciones.',
  'Art. 15: intimidad y habeas data; para efectos tributarios o judiciales puede exigirse la presentación de libros de contabilidad y documentos privados en los términos de la ley.',
  'Art. 23 derecho de petición; art. 29 debido proceso (es nula de pleno derecho la prueba obtenida con violación del debido proceso).',
  'Art. 86 tutela: protección inmediata de derechos fundamentales; fallo en máximo 10 días.',
  'Art. 95-9: deber de contribuir al financiamiento de los gastos e inversiones del Estado dentro de conceptos de justicia y equidad.',
  'Art. 338: en tiempo de paz solo el Congreso, las asambleas y los concejos pueden imponer contribuciones; la ley debe fijar sujetos, hechos, bases y tarifas. Tributos de periodo: rigen desde el periodo que empiece después de la vigencia de la norma.',
  'Art. 363: el sistema tributario se funda en equidad, eficiencia y progresividad; las leyes tributarias no son retroactivas.',
  'Art. 209: la función administrativa se rige por igualdad, moralidad, eficacia, economía, celeridad, imparcialidad y publicidad.',
  'Art. 125: los empleos son de carrera; ingreso y ascenso por mérito. Art. 130: la CNSC administra y vigila las carreras (salvo las especiales de origen constitucional).',
  'Art. 189-20: el Presidente vela por la estricta recaudación y administración de las rentas públicas.'
 ]},
 {id:'gest', nombre:'Gestión pública, MIPG, integridad y servicio', grupo:'Funcional transversal', peso:9, icon:'🗂️',
  eje:'Ejes 8, 9, 10, 11, 14: herramientas informáticas, gestión documental, MIPG, códigos de integridad y buen gobierno, servicio al ciudadano',
  ficha:[
  'MIPG (Decreto 1499 de 2017): 7 dimensiones — Talento humano (corazón del modelo), Direccionamiento estratégico y planeación, Gestión con valores para resultados, Evaluación de resultados, Información y comunicación, Gestión del conocimiento y la innovación, y Control interno. Se mide con el FURAG.',
  'Esquema de líneas de defensa: línea estratégica (alta dirección), 1.ª línea (líderes de proceso: controles del día a día), 2.ª línea (planeación, supervisión: monitoreo), 3.ª línea (Oficina de Control Interno: evaluación independiente).',
  'Código de Integridad del servicio público: Honestidad, Respeto, Compromiso, Diligencia y Justicia.',
  'Gestión documental: Ley 594 de 2000. Ciclo vital: archivo de gestión → central → histórico. Tablas de Retención Documental (TRD), FUID (inventario), Programa de Gestión Documental (PGD). Principios de procedencia y orden original.',
  'Ley 1712 de 2014: máxima publicidad. Información clasificada (daña derechos de personas: intimidad, secretos comerciales) vs reservada (daña intereses públicos: defensa, seguridad, investigación de delitos). La reserva dura máximo 15 años.',
  'Reserva tributaria (art. 583 ET): la información de las declaraciones tiene carácter reservado.',
  'Ley 1474 de 2011: Plan Anticorrupción y de Atención al Ciudadano anual (art. 73).',
  'Atención preferencial (Decreto 019 de 2012): personas con discapacidad, embarazadas, niños, adultos mayores y veteranos.',
  'Atención presencial mínima 40 horas a la semana (art. 7 CPACA).',
  'Estructura de la DIAN: Decreto 1742 de 2020. Carrera específica: Decreto Ley 071 de 2020. Sistema informático tributario: MUISCA.'
 ]},
 {id:'integ', nombre:'Integridad', grupo:'Comportamental e integridad', peso:0, icon:'🛡️',
  eje:'Prueba de Integridad (clasificatoria, 10 %) · Código de Integridad · Comportamiento ético nivel 4',
  ficha:[
  'Formato real: autoinforme tipo Likert de 4 opciones (Totalmente en desacuerdo, En desacuerdo, De acuerdo, Totalmente de acuerdo). Mide coherencia ética y confiabilidad.',
  'Incluye 2 subescalas de control que detectan respuestas exageradamente favorables ("nunca me he equivocado", "jamás he sentido enojo"). Ante afirmaciones absolutas e irreales, lo honesto suele ser no marcar el extremo favorable.',
  'Dádivas: el servidor no acepta regalos, invitaciones ni beneficios de contribuyentes o usuarios, sin importar su valor. Ofrecimiento indebido → rechazar, dejar constancia e informar.',
  'Conflicto de intereses: si tienes interés personal, familiar o económico en un asunto (parientes, socios, amigos íntimos), debes declararte impedido y no actuar (Ley 1952 de 2019, CPACA art. 11, Ley 2013 de 2019 sobre declaración de conflictos).',
  'Reserva tributaria (art. 583 ET): la información de declaraciones y expedientes solo se usa para fines oficiales; no se comenta con terceros, familiares ni medios.',
  'Uso de recursos públicos: vehículos, equipos, tiempo laboral y sistemas (MUISCA) son para fines del servicio; consultar datos de un contribuyente sin necesidad del trámite es indebido.',
  'Denuncia de irregularidades: canales formales (superior, Oficina de Control Disciplinario Interno, canal de denuncias de la DIAN); el denunciante de buena fe está protegido.',
  'Valores del Código de Integridad: Honestidad, Respeto, Compromiso, Diligencia y Justicia.',
  'Código Disciplinario: Ley 1952 de 2019 (modificada por la Ley 2094 de 2021).'
 ]},
 {id:'comp', nombre:'Competencias comportamentales', grupo:'Comportamental e integridad', peso:0, icon:'🤝',
  eje:'Comportamiento ético (N4), Comunicación efectiva (N3), Adaptabilidad (N3), Trabajo en equipo (N3), Orientación al logro, Orientación al usuario',
  ficha:[
  'En el examen real esta prueba es de AUTOINFORME tipo Likert (4 opciones). Aquí se entrena con casos situacionales para que interiorices la conducta esperada.',
  'Subescalas de control: miden respuestas "exageradamente favorables". Responde con consistencia y realismo; no marques extremos por reflejo.',
  'Comportamiento ético nivel 4 (el más alto): actúa con integridad aun bajo presión, denuncia irregularidades, rechaza dádivas, es ejemplo para otros.',
  'Patrón de respuesta correcta: seguir el procedimiento, usar los canales formales, proteger la información reservada, servir al ciudadano con igualdad, informar al superior y documentar.',
  'Patrones incorrectos: favorecer conocidos, "ayudar" saltándose el procedimiento, ocultar errores propios, ceder a presiones, divulgar información reservada, confrontar en público.',
  'Trabajo en equipo: compartir información, reconocer aportes, resolver conflictos con diálogo directo y respetuoso.',
  'Adaptabilidad: asumir cambios normativos o tecnológicos con disposición, aprendiendo rápido.',
  'Comunicación efectiva: mensajes claros, escucha activa, lenguaje claro con el ciudadano.'
 ]}
